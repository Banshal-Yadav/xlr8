[package]
name = "xlr8"
version = "0.1.0"
edition = "2021"
authors = ["Banshal-Yadav"]
description = "GitHub in a box — instant local web viewer for repos, diffs and PRs"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
gix = { version = "0.70", default-features = false, features = ["basic", "max-performance-safe"] }
imara-diff = { version = "0.1", default-features = false }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
