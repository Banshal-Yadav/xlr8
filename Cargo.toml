[package]
name = "xlr8"
version = "0.1.0"
edition = "2021"
description = "GitHub in a box — instant local web viewer for repos, diffs and PRs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
gix = "0.70"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
