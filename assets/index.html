<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xlr8</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0a0a'/><path d='M4 3l5 5-5 5' stroke='%23cbb0f7' stroke-width='2' fill='none'/></svg>">
<style>
  :root {
    --bg0: #0a0a0a;
    --bg1: #101010;
    --bg2: #161616;
    --bg3: #1c1c1c;
    --bg4: #242424;
    --bd: #262626;
    --bd2: #333333;
    --fg: #d4d4d4;
    --fg1: #9a9a9a;
    --fg2: #6a6a6a;
    --fg3: #4a4a4a;
    --acc: #cbb0f7;
    --add: #3fb950;
    --addbg: rgba(63, 185, 80, 0.13);
    --del: #f85149;
    --delbg: rgba(248, 81, 73, 0.10);
    --kw: #d2a8ff;
    --str: #a5d6ff;
    --com: #8b949e;
    --num: #79c0ff;
    --typ: #ffa657;
    --fn: #d2a8ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sbw: 264px;
    --lh: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg0);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--acc); color: #000; }
  :focus-visible { outline: 1px solid var(--acc); outline-offset: -1px; }
  * { scrollbar-width: thin; scrollbar-color: #2e2e2e transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e2e; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  ::-webkit-scrollbar-corner { background: transparent; }
  button, input, select {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg);
    background: var(--bg2);
    border: 1px solid var(--bd2);
    padding: 4px 10px;
    cursor: pointer;
  }
  input { cursor: text; }
  button:hover { background: var(--bg4); border-color: #444; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: var(--bg2); border-color: var(--bd2); }
  select { padding-right: 4px; }
  input[type="text"], input[type="search"] { cursor: text; }
  input::placeholder { color: var(--fg3); }
  .mono { font-family: var(--mono); }
  .dim { color: var(--fg2); }
  .a { color: var(--add); }
  .d { color: var(--del); }
  .num { font-variant-numeric: tabular-nums; }
  mark { background: rgba(203, 176, 247, 0.35); color: inherit; padding: 0 1px; }

  /* ── app shell ─────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-columns: 44px var(--sbw) 1fr;
    grid-template-rows: 1fr 24px;
    height: 100vh;
    min-width: 900px;
  }
  #activity {
    grid-row: 1;
    background: var(--bg1);
    border-right: 1px solid var(--bd);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #activity .act {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--fg2);
    padding: 0;
  }
  #activity .act:hover { color: var(--fg); background: var(--bg3); }
  #activity .act.active { color: var(--acc); border-left-color: var(--acc); background: var(--bg0); }
  #activity .act svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  #activity .spacer { flex: 1; }

  #sidebar {
    grid-row: 1;
    background: var(--bg1);
    border-right: 1px solid var(--bd);
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    position: relative;
  }
  #side-resizer {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 6px;
    cursor: col-resize;
    z-index: 5;
  }
  #side-resizer:hover, #side-resizer.drag { background: var(--acc); opacity: 0.4; }
  .side-head {
    padding: 8px 10px;
    border-bottom: 1px solid var(--bd);
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .side-title {
    width: 100%;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg2);
  }
  .side-body { flex: 1; overflow: auto; min-height: 0; }
  .side-foot {
    border-top: 1px solid var(--bd);
    padding: 6px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    color: var(--fg1);
  }

  #main {
    grid-row: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--bg0);
  }
  #toolbar {
    height: 34px;
    border-bottom: 1px solid var(--bd);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    flex-shrink: 0;
    background: var(--bg1);
    overflow: hidden;
  }
  #toolbar .grow { flex: 1; }
  #content { flex: 1; overflow: hidden; min-height: 0; position: relative; }

  #statusbar {
    grid-column: 1 / -1;
    grid-row: 2;
    background: var(--bg1);
    border-top: 1px solid var(--bd);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg1);
    white-space: nowrap;
    overflow: hidden;
  }
  #statusbar .grow { flex: 1; }
  #st-lat { color: var(--fg); font-weight: 700; flex: none; }
  #st-spark { flex: none; max-width: 24ch; overflow: hidden; }
  #st-stats { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── panels / boxes ────────────────────────────────────── */
  .panel {
    border: 1px solid var(--bd);
    background: var(--bg1);
    margin: 10px;
  }
  .panel-h {
    padding: 6px 10px;
    border-bottom: 1px solid var(--bd);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg2);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--bg2);
  }
  .panel-h .grow { flex: 1; }
  .panel-b { padding: 10px; }

  /* ── file tree ─────────────────────────────────────────── */
  #tree { padding: 4px 0; font-family: var(--mono); font-size: 12px; }
  .tnode {
    display: flex;
    align-items: center;
    height: 22px;
    padding-right: 8px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    color: var(--fg1);
  }
  .tnode:hover { background: var(--bg3); color: var(--fg); }
  .tnode.sel { background: var(--bg4); color: var(--fg); }
  .tnode .chev {
    width: 16px; flex: none;
    text-align: center;
    color: var(--fg2);
    font-size: 10px;
  }
  .tnode .ficon { width: 16px; flex: none; text-align: center; margin-right: 4px; font-size: 10px; }
  .tnode.dir .ficon { color: var(--acc); }
  .tnode.file .ficon { color: var(--fg2); }
  .tnode.gitlink .ficon { color: var(--typ); }
  .tnode .tname { overflow: hidden; text-overflow: ellipsis; }

  /* ── code view ─────────────────────────────────────────── */
  .code-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--bd);
    background: var(--bg1);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg1);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .code-head .path { color: var(--fg); font-weight: 600; }
  .code-head .sha {
    color: var(--acc);
    cursor: pointer;
    border: 1px solid var(--bd2);
    padding: 1px 6px;
    background: var(--bg2);
  }
  .code-head .sha:hover { background: var(--bg4); }
  .code-head .grow { flex: 1; }
  .vscroll { flex: 1; overflow: auto; min-height: 0; position: relative; }
  .vinner { position: relative; }
  .vrow { position: absolute; left: 0; right: 0; display: flex; height: var(--lh); line-height: var(--lh); font-family: var(--mono); font-size: 12px; white-space: pre; }
  .vrow .ln {
    width: 56px; flex: none;
    text-align: right;
    padding-right: 10px;
    color: var(--fg3);
    user-select: none;
    background: var(--bg1);
    border-right: 1px solid var(--bd);
  }
  .vrow .lc { padding-left: 12px; padding-right: 24px; }
  .vrow:hover { background: var(--bg2); }
  .vrow:hover .ln { background: var(--bg2); color: var(--fg1); }
  .vrow.add { background: var(--addbg); }
  .vrow.add .ln { background: var(--bg1); color: var(--add); }
  .vrow.del { background: var(--delbg); }
  .vrow.del .ln { background: var(--bg1); color: var(--del); }
  .vrow.hunkrow, .vrow.gaprow {
    background: var(--bg2);
    color: var(--fg2);
    border-top: 1px solid var(--bd);
    border-bottom: 1px solid var(--bd);
    font-size: 11px;
  }
  .vrow.hunkrow .ln, .vrow.gaprow .ln { background: var(--bg2); color: var(--fg3); border-right-color: var(--bd2); }
  .vrow.gaprow { background: var(--bg0); }
  .vrow.focusline { background: rgba(203,176,247,0.13); }
  .vrow.focusline .ln { color: var(--acc); }
  .wrap .vrow { white-space: pre-wrap; word-break: break-all; height: auto; min-height: var(--lh); }
  .wrap .vinner { /* heights approximate when wrapped — fall back to static render */ }

  /* syntax */
  .k { color: var(--kw); }
  .s { color: var(--str); }
  .c { color: var(--com); font-style: italic; }
  .n { color: var(--num); }
  .t { color: var(--typ); }
  .f { color: var(--fn); }
  .p { color: var(--fg2); }

  /* ── lists (commits, search hits, diff files, pulls) ───── */
  .lrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    height: 30px;
    border-bottom: 1px solid var(--bd);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
  }
  .lrow:hover { background: var(--bg3); }
  .lrow.sel { background: var(--bg4); }
  .lrow .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .lrow .sha {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--acc);
    flex: none;
  }
  .lrow .stat { font-family: var(--mono); font-size: 11px; flex: none; }
  .lrow .when { color: var(--fg2); font-size: 11px; flex: none; }
  .lrow .who { color: var(--fg1); font-size: 11px; flex: none; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    border: 1px solid var(--bd2);
    padding: 1px 6px;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--fg1);
    flex: none;
    background: var(--bg2);
  }
  .badge.A { color: var(--add); border-color: rgba(63,185,80,0.4); }
  .badge.D { color: var(--del); border-color: rgba(248,81,73,0.4); }
  .badge.M { color: var(--acc); border-color: rgba(203,176,247,0.35); }
  .badge.R, .badge.C { color: var(--typ); border-color: rgba(255,166,87,0.35); }

  /* ── search ────────────────────────────────────────────── */
  .hit {
    padding: 6px 10px;
    border-bottom: 1px solid var(--bd);
    cursor: pointer;
    overflow: hidden;
  }
  .hit:hover { background: var(--bg3); }
  .hit.sel { background: var(--bg4); }
  .hit .hpath { font-family: var(--mono); font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .hmeta { color: var(--fg2); font-size: 10px; margin-top: 2px; }
  .hit .hline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .hit .hline .hno { color: var(--fg3); margin-right: 6px; }

  /* ── palette (ctrl+p) ──────────────────────────────────── */
  #palette-ov {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding-top: 12vh;
  }
  #palette-ov.open { display: flex; }
  #palette {
    width: 620px;
    max-width: 92vw;
    background: var(--bg1);
    border: 1px solid var(--bd2);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    max-height: 60vh;
  }
  #palette input {
    border: none;
    border-bottom: 1px solid var(--bd2);
    padding: 10px 12px;
    background: var(--bg0);
    font-family: var(--mono);
    font-size: 12px;
  }
  #palette-list { overflow: auto; flex: 1; }
  #palette-list .prow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    height: 28px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    color: var(--fg1);
    white-space: nowrap;
    overflow: hidden;
  }
  #palette-list .prow.sel { background: var(--bg4); color: var(--fg); }
  #palette-list .prow .pd { color: var(--fg3); }
  #palette-list .prow .pf { overflow: hidden; text-overflow: ellipsis; }

  /* ── misc ──────────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 36px;
    right: 14px;
    background: var(--fg);
    color: #000;
    padding: 7px 14px;
    font-weight: 600;
    display: none;
    z-index: 60;
  }
  .empty {
    padding: 40px;
    text-align: center;
    color: var(--fg2);
    font-size: 12px;
  }
  .empty b { color: var(--fg1); }
  kbd {
    border: 1px solid var(--bd2);
    background: var(--bg2);
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg1);
  }
  .crumb { cursor: pointer; color: var(--fg1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 220px; }
  .crumb:hover { color: var(--acc); }
  .crumb.cur { color: var(--fg); cursor: default; }
  .crumb.cur:hover { color: var(--fg); }
  #toolbar { white-space: nowrap; }
  .hintbar {
    display: flex; gap: 14px; align-items: center;
    color: var(--fg2); font-size: 11px;
    padding: 6px 12px; border-top: 1px solid var(--bd);
    background: var(--bg1); flex-shrink: 0;
  }
  .table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .table td { padding: 5px 10px; border-bottom: 1px solid var(--bd); vertical-align: top; }
  .table td:first-child { color: var(--fg2); width: 90px; font-size: 11px; }
  .binbox { padding: 30px; text-align: center; color: var(--fg1); font-family: var(--mono); }
</style>
</head>
<body>
<div id="app">
  <nav id="activity" aria-label="views">
    <button class="act active" data-tab="files" title="Files (1)">
      <svg viewBox="0 0 24 24"><path d="M4 4h7l2 3h7v13H4z"/></svg>
    </button>
    <button class="act" data-tab="search" title="Search (2)">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    </button>
    <button class="act" data-tab="commits" title="Commits (3)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></svg>
    </button>
    <button class="act" data-tab="compare" title="Compare (4)">
      <svg viewBox="0 0 24 24"><path d="M7 4v11M7 15l-3-3M7 15l3-3M17 20V9M17 9l-3 3M17 9l3 3"/></svg>
    </button>
    <button class="act" data-tab="pulls" title="Pulls (5)">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M7 8.5v7M17 15.5V10a3 3 0 0 0-3-3h-2l2-2M12 7l2 2"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="act" id="btn-palette" title="Quick open (Ctrl+P)">
      <svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>
    </button>
  </nav>

  <aside id="sidebar">
    <div id="side-resizer"></div>
    <div class="side-head">
      <span class="side-title" id="side-title">Explorer</span>
      <select id="repo-select" style="flex:1;min-width:0" title="repository"></select>
      <button id="add-repo-btn" title="clone a repo by owner/name or URL">+</button>
      <button id="sync-btn" title="fetch from origin">SYNC</button>
    </div>
    <div id="side-add" style="display:none;padding:6px 8px;border-bottom:1px solid var(--bd)">
      <input id="add-repo-input" type="text" placeholder="owner/repo or github URL" spellcheck="false" autocomplete="off" style="width:100%">
    </div>
    <div id="side-sub" class="side-head" style="display:none"></div>
    <div id="side-body" class="side-body"></div>
    <div class="side-foot" id="side-foot"><span class="dim">booting…</span><span class="grow" style="flex:1"></span><span class="dim num" id="sf-ms">—</span></div>
  </aside>

  <section id="main">
    <div id="toolbar"></div>
    <div id="content"></div>
    <div class="hintbar" id="hintbar"></div>
  </section>

  <footer id="statusbar">
    <span id="st-repo" class="dim"></span>
    <span id="st-ref" class="dim"></span>
    <span class="grow"></span>
    <span id="st-spark" class="dim"></span>
    <span id="st-lat">—</span>
    <span id="st-stats" class="dim"></span>
  </footer>
</div>

<div id="palette-ov">
  <div id="palette">
    <input id="palette-input" type="text" placeholder="Go to file — type path fragment" spellcheck="false" autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════ core helpers ═══════════════ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); };
const fmtBytes = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : b >= 1024 ? (b / 1024).toFixed(1) + " KB" : b + " B";
const fmtDur = (s) => s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d";
const fmtRel = (ts) => { const d = Math.max(0, Math.floor(Date.now() / 1000) - ts); return fmtDur(d) + " ago"; };
const asciiLower = (s) => s.replace(/[A-Z]/g, c => String.fromCharCode(c.charCodeAt(0) + 32));

let LAT = [];
const SPARK_CH = "▁▂▃▄▅▆▇█";
function mark(ms) {
  LAT.push(ms);
  if (LAT.length > 40) LAT.shift();
  $("#st-spark").textContent = LAT.map(v => SPARK_CH[Math.min(7, Math.floor(v / Math.max(...LAT, 1) * 7.999))]).join("");
  const txt = (ms >= 100 ? Math.round(ms) : ms.toFixed(1)) + "ms";
  $("#st-lat").textContent = txt;
  const sf = $("#sf-ms");
  if (sf) sf.textContent = txt;
}
async function api(path) {
  const t0 = performance.now();
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.text().catch(() => "")) || r.status);
  const j = await r.json();
  mark(performance.now() - t0);
  return j;
}

let lastS = null, fetchedAt = 0;
let lastFoot = "";
function renderStats() {
  if (!lastS) return;
  const drift = Math.floor((Date.now() - fetchedAt) / 1000);
  $("#st-stats").textContent =
    "ram " + fmtBytes(lastS.rss) +
    " · cpu " + (lastS.cpu_ms / 1000).toFixed(1) + "s" +
    " · up " + fmtDur(lastS.uptime_s + drift) +
    " · cache " + fmtBytes(lastS.cache_bytes) + "/32m" +
    " · reqs " + lastS.reqs;
  const synced = lastS.synced_s ? lastS.synced_s + drift : 0;
  const foot = synced ? "synced " + fmtDur(synced) + " ago" : "never synced";
  if (foot === lastFoot) return; // skip DOM rebuild when text unchanged
  lastFoot = foot;
  const cur = $("#sf-ms")?.textContent || "—";
  $("#side-foot").innerHTML = `<span class="dim">${foot}</span><span class="grow" style="flex:1"></span><span class="dim num" id="sf-ms">${cur}</span>`;
}
function refreshStats() {
  if (document.hidden) return;
  fetch("/api/stats").then(r => r.ok ? r.json() : null).then(s => { if (s) { lastS = s; fetchedAt = Date.now(); renderStats(); } }).catch(() => {});

setInterval(refreshStats, 2000);

    const defRef = pref.find(n => names.includes(n)) || names[0] || "HEAD";
  S.ref = h.ref && names.includes(h.ref) ? h.ref : (sameRepo && names.includes(S.ref) ? S.ref : defRef);
  // default compare to HEAD~1...HEAD so the first visit shows a real diff;
  // on sync (same repo, no explicit base/head in hash) preserve user's range
  S.base = h.base || (sameRepo && S.base ? S.base : (names.includes(defRef) ? defRef + "~1" : defRef));
  S.head = h.head || (sameRepo && S.head ? S.head : defRef);
    $("#st-ref").textContent = S.ref;
    setTab(h.tab || (sameRepo ? S.tab : "files"), { silent: true });
    saveHash(); // keep hash in sync with actual state after any repo/sync change
    if (S.path && S.tab === "files") openFile(S.path);
    else if (S.tab === "search" && searchState.lastQ) doSearch();
    else if (S.tab === "commits") loadCommits();
    else if (S.tab === "compare" && S.base && S.head) runDiff();
  } catch (e) { toast("repo load failed: " + e); }
}

function fillRefSelect(sel, val) {

function debounce(fn, ms) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }

/* ═══════════════ file tree ═══════════════ */
async function loadTree(dir, quiet) {
  const key = dir;
  if (treeCache.has(key)) { if (!quiet) renderTree(); return; }
  try {
    const r = await api(`/api/${S.repo}/tree?ref=${encodeURIComponent(S.ref)}&path=${encodeURIComponent(dir)}`);
    treeCache.set(key, r.entries);
    if (!quiet) renderTree();
  } catch (e) {
    const el = $("#tree");
    if (el) el.innerHTML = `<div class="empty">${esc(String(e))}</div>`;
  }
}
function toggleDir(dir) {
  if (expanded.has(dir)) { expanded.delete(dir); renderTree(); }
  else { expanded.add(dir); loadTree(dir); }
}
function renderTree(filter) {
  const el = $("#tree");
  if (!el) return;
  const q = filter !== undefined ? filter : ($("#tree-filter")?.value || "").trim().toLowerCase();
  if (q.length >= 2) {
    // filter mode: flat fuzzy over full file list
    renderTreeFilter(el, q);
    return;
  }
  let html = "";
  const walk = (dir, depth) => {
    const entries = treeCache.get(dir);
    if (!entries) return;
    for (const e of entries) {
      const pad = 6 + depth * 14;
      if (e.kind === "tree") {
        const open = expanded.has(e.path);
        html += `<div class="tnode dir" data-dir="${esc(e.path)}" style="padding-left:${pad}px">
          <span class="chev">${open ? "▾" : "▸"}</span><span class="ficon">▣</span><span class="tname">${esc(e.name)}</span></div>`;
        if (open) walk(e.path, depth + 1);
      } else {
        const sel = S.path === e.path ? " sel" : "";
        const isGitlink = e.kind === "commit";
        const icon = isGitlink ? "◈" : "·";
        const cls = isGitlink ? "tnode gitlink" : "tnode file";
        html += `<div class="${cls}${sel}" data-file="${esc(e.path)}" data-kind="${e.kind}" style="padding-left:${pad}px">
          <span class="chev"></span><span class="ficon">${icon}</span><span class="tname">${esc(e.name)}</span></div>`;
      }
    }
  };
  walk("", 0);
  if (!html) html = '<div class="empty">empty tree</div>';
  el.innerHTML = html;
  // delegated handlers: one listener per event, not per node
  el.onclick = (e) => {
    const n = e.target.closest(".tnode");
    if (!n) return;
    if (n.dataset.dir !== undefined) toggleDir(n.dataset.dir);
    else if (n.dataset.file) {
      if (n.dataset.kind === "commit") { showGitlink(n.dataset.file); return; }
      openFile(n.dataset.file);
    }
  };
  el.onkeydown = (e) => {
    const n = e.target.closest(".tnode");
    if (!n) return;
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (n.dataset.dir !== undefined) toggleDir(n.dataset.dir);
    else if (n.dataset.file) {
      if (n.dataset.kind === "commit") { showGitlink(n.dataset.file); return; }
      openFile(n.dataset.file);
    }
  };
  el.querySelectorAll(".tnode").forEach(n => { n.tabIndex = 0; });
}
async function renderTreeFilter(el, q) {
  const files = await getFiles();
  const hits = fuzzyFilter(files, q, 200);
  el.innerHTML = hits.map(p => {
    const sel = S.path === p ? " sel" : "";
    const name = p.split("/").pop();
    return `<div class="tnode file${sel}" data-file="${esc(p)}" style="padding-left:10px">
      <span class="chev"></span><span class="ficon">·</span><span class="tname">${esc(name)} <span class="dim">${esc(p.slice(0, Math.max(0, p.length - name.length - 1)))}</span></span></div>`;
  }).join("") || '<div class="empty">no matches</div>';
  el.onclick = (e) => {
    const n = e.target.closest(".tnode.file");
    if (n?.dataset.file) { openFile(n.dataset.file); }
  };
}
function onTreeFilter() {
  clearTimeout(onTreeFilter._t);
  onTreeFilter._t = setTimeout(() => renderTree(), 80);
}

async function getFiles() {
  const key = S.repo + "\0" + S.ref;
  if (filesCache && filesCacheKey === key) return filesCache;
  const r = await api(`/api/${S.repo}/files?ref=${encodeURIComponent(S.ref)}`);
  filesCache = r.files;
  filesCacheKey = key;
  return filesCache;
}
function fuzzyFilter(list, q, limit, lowered) {
  const lq = asciiLower(q);
  const out = [];
  let i = 0;
  for (const p of list) {
    // reuse precomputed lowercase (pal.lc) when provided — avoids O(n) regex per keystroke
    if ((lowered ? lowered[i] : asciiLower(p)).includes(lq)) {
      out.push(p);
      if (out.length >= limit) break;
    }
    i++;
  }
  // shorter + shallower first
  out.sort((a, b) => a.split("/").length - b.split("/").length || a.length - b.length);
  return out;
}

function showGitlink(path) {

/* expand tree to a path (open-file navigation) */
async function revealPath(path) {
  // clear filter so dir nodes are visible (filter mode hides the tree structure)
  const tf = $("#tree-filter");
  if (tf && tf.value) { tf.value = ""; }
  const parts = path.split("/");
  let changed = false;
  for (let i = 1; i < parts.length; i++) {
    const dir = parts.slice(0, i).join("/");
    if (!expanded.has(dir)) {
      expanded.add(dir);
      changed = true;
      await loadTree(dir, true); // quiet: revealPath renders once at the end
    }
  }
  // only rebuild the tree DOM when the visible structure actually changed;
  // otherwise an in-place .sel toggle is enough (opening files back-to-back
  // in a large tree was rebuilding the whole explorer each time)
  if (changed) renderTree();
  highlightTreeSel();

  if (node) node.scrollIntoView({ block: "nearest" });
}

  el.querySelectorAll(".tnode.sel").forEach(n => n.classList.remove("sel"));
  const node = el.querySelector(`.tnode[data-file="${CSS.escape(S.path || "")}"]`);
  if (node) node.classList.add("sel");

let codeState = { lines: null, lang: null, states: null, vs: null, focusLine: 0, terms: [] };
async function openFile(path, opts = {}) {
  const wasFiles = S.tab === "files";
  S.path = path;
  S.tab = "files"; // set before saveHash so the hash reflects the tab we're switching to
  codeState.lines = null; // invalidate any in-flight repaint (binary/error/switch)
  saveHash(true);
  if (!wasFiles) { setTab("files", { silent: true }); return; } // re-enters renderFilesMain → openFile
  highlightTreeSel(); // in-place .sel; revealPath only rebuilds when structure changes
  revealPath(path).catch(() => {});

  const tb = $("#toolbar"), c = $("#content"), hb = $("#hintbar");
  clearVS();
  c.style.display = "flex"; c.style.flexDirection = "column"; c.style.overflow = "hidden";
  tb.innerHTML = breadcrumbHTML(path);
  bindCrumbs(tb);
  c.innerHTML = '<div class="code-head" id="code-head" style="flex-shrink:0"><span class="dim">loading…</span></div><div class="vscroll" id="code-scroll" style="flex:1;min-height:0;overflow:auto"></div>';
  hb.innerHTML = `<span class="dim mono" style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(S.repo)} @ ${esc(S.ref)}</span><button id="btn-wrap" class="dim">WRAP</button><span class="dim">Ctrl+F find</span>`;
  $("#btn-wrap").onclick = () => { S.wrap = !S.wrap; paintCode(); $("#btn-wrap").classList.toggle("on", S.wrap); $("#btn-wrap").style.color = S.wrap ? "var(--acc)" : ""; };

  const key = S.ref + "\0" + path;
  let b = blobCache.get(key);
  const tok = openFile._tok = (openFile._tok || 0) + 1;
  try {
    if (!b) { b = await api(`/api/${S.repo}/blob?ref=${encodeURIComponent(S.ref)}&path=${encodeURIComponent(path)}`); blobCache.set(key, b); }
    if (tok !== openFile._tok) return;
    renderCodeHead(b, null);
    if (b.binary) {
      const sc = $("#code-scroll");
      if (sc) sc.innerHTML = `<div class="binbox">binary file — ${fmtBytes(b.size)}</div>`;
      return;
    }
    codeState.lines = b.text.split("\n");
    codeState.lang = langOf(path);
    codeState.states = hlStates(codeState.lines, codeState.lang);
    codeState.focusLine = opts.line || 0;
    codeState.terms = opts.terms || [];
    paintCode();
    if (opts.line) {
      const i = opts.line - 1;
      requestAnimationFrame(() => codeState.vs && codeState.vs.scrollToRow(i, true));
    }

  }

  metaFor(path).then(m => { if (openFile._tok === tok) renderCodeHead(b || { path, size: 0, lines: 0, binary: false, text: "" }, m); }).catch(() => {});

function breadcrumbHTML(path) {
  const parts = path.split("/");

  let acc = "";
  parts.forEach((p, i) => {
    acc = acc ? acc + "/" + p : p;
    const last = i === parts.length - 1;
    html += `<span class="dim">/</span><span class="crumb${last ? " cur" : ""}"${last ? "" : ` data-dir="${esc(acc)}"`}>${esc(p)}</span>`;
  });
  html += '<span class="grow"></span>';
  return html;
}
function bindCrumbs(tb) {

    const dir = el.dataset.dir;

    const tf = $("#tree-filter");

    expanded.add(dir || "");
    if (dir) { for (let i = 1; i < dir.split("/").length; i++) expanded.add(dir.split("/").slice(0, i).join("/")); }
    loadTree("").then(() => renderTree());
    renderMain();
    saveHash();

}
async function metaFor(path) {
  const key = S.ref + "\0" + path;
  if (metaCache.has(key)) return metaCache.get(key);
  const m = await api(`/api/${S.repo}/meta?ref=${encodeURIComponent(S.ref)}&path=${encodeURIComponent(path)}`);
  metaCache.set(key, m);
  return m;
}
function renderCodeHead(b, m) {
  const el = $("#code-head");
  if (!el) return;
  const bits = [];
  bits.push(`<span class="path">${esc(b.path)}</span>`);
  if (b.binary) bits.push(`<span class="badge">BIN</span>`);
  else {
    bits.push(`<span>${fmtBytes(b.size)}</span>`);
    bits.push(`<span>${(b.lines || 0).toLocaleString()} lines</span>`);
  }
  if (b.truncated) bits.push(`<span class="badge">truncated 1MB</span>`);
  if (m && m.last) {
    bits.push(`<span style="flex:1"></span>`);

  const tok = ++diffState.tok;
  let u = `/api/${S.repo}/file?base=${encodeURIComponent(diffState.summary.base)}&head=${encodeURIComponent(diffState.summary.head)}&path=${encodeURIComponent(file.path)}`;
  if (file.old_path && file.old_path !== file.path) u += `&old_path=${encodeURIComponent(file.old_path)}`;
  el.innerHTML = `<div class="code-head"><span class="badge ${file.status}">${file.status}</span><span class="path">${esc(file.path)}</span>${file.old_path && file.old_path !== file.path ? `<span class="dim">renamed from</span><span class="mono">${esc(file.old_path)}</span>` : ""}<span class="grow"></span><span class="num"><span class="a">+${file.additions}</span> <span class="d">−${file.deletions}</span></span></div><div class="vscroll" id="diff-scroll"></div><div class="code-head" style="border-top:1px solid var(--bd);border-bottom:none" id="diff-foot"></div>`;
  try {
    const fd = await api(u);
    if (tok !== diffState.tok) return;
    $("#diff-foot").innerHTML = fd.too_large ? "too large" : fd.binary ? "binary file" : `${fd.hunks.length} hunks · ${fd.hunks.reduce((s, h) => s + h.lines.length, 0)} changed lines`;
    if (fd.binary) { $("#diff-scroll").innerHTML = '<div class="binbox">binary — no textual diff</div>'; return; }
    if (fd.too_large) { $("#diff-scroll").innerHTML = '<div class="binbox">file too large to diff (>1 MiB)</div>'; return; }
    if (!fd.hunks.length) { $("#diff-scroll").innerHTML = '<div class="binbox">no textual changes</div>'; return; }
    // build rows
    const rows = [];
    let prev = null;
    for (const h of fd.hunks) {
      const gapOld = prev ? h.old_start - (prev.old_start + prev.old_count) : (h.old_count ? h.old_start - 1 : h.old_start);
      const gapNew = prev ? h.new_start - (prev.new_start + prev.new_count) : (h.new_count ? h.new_start - 1 : h.new_start);
      const gap = Math.max(gapOld, gapNew, 0);
      if (gap > 0) rows.push(["g", `⋯ ${gap} lines unchanged`]);
      rows.push(["h", `@@ -${h.old_start},${h.old_count} +${h.new_start},${h.new_count} @@`]);
      let o = h.old_start, n = h.new_start;
      for (const l of h.lines) {
        let oc = "", nc = "";
        if (l.kind === "add") nc = n++;
        else if (l.kind === "del") oc = o++;
        else { oc = o++; nc = n++; }
        rows.push([l.kind === "add" ? "add" : l.kind === "del" ? "del" : "ctx", oc, nc, l.text]);
      }
      prev = h;
    }
    const lang = langOf(file.path);
    const LH = 20, HH = 26, GH = 24;
    const tops = new Int32Array(rows.length + 1);
    for (let k = 0; k < rows.length; k++) tops[k + 1] = tops[k] + (rows[k][0] === "h" ? HH : rows[k][0] === "g" ? GH : LH);
    diffState.rows = rows;
    const vs = new VScroll($("#diff-scroll"), LH);
    diffVSObj = vs;
    vs.setRows(rows.length, (k) => {
      const r = rows[k];
      if (r[0] === "h") return `<div class="vrow hunkrow" style="top:%TOP%px;height:${HH}px;line-height:${HH - 4}px"><span class="ln"></span><span class="lc">${esc(r[1])}</span></div>`;
      if (r[0] === "g") return `<div class="vrow gaprow" style="top:%TOP%px;height:${GH}px;line-height:${GH}px"><span class="ln"></span><span class="lc">${esc(r[1])}</span></div>`;
      const cls = r[0] === "add" ? " add" : r[0] === "del" ? " del" : "";
      const body = hlLine(r[3], lang, 0).html;
      return `<div class="vrow${cls}" style="top:%TOP%px"><span class="ln">${r[1]}</span><span class="ln" style="border-right:1px solid var(--bd);left:56px">${r[2]}</span><span class="lc" style="padding-left:12px">${body}</span></div>`;
    }, tops);
  } catch (e) {
    if (tok === diffState.tok) $("#diff-scroll") && ($("#diff-scroll").innerHTML = `<div class="empty">${esc(String(e))}</div>`);
  }
}
function diffFind(q) {
  diffState.find.q = asciiLower(q);
  diffState.find.matches = [];
  diffState.find.idx = -1;
  if (!diffState.find.q || !diffState.rows) { $("#diff-tbinfo") && ($("#diff-tbinfo").textContent = diffState.info); return; }
  for (let ri = 0; ri < diffState.rows.length; ri++) {
    const r = diffState.rows[ri];
    if ((r[0] === "add" || r[0] === "del" || r[0] === "ctx") && asciiLower(String(r[3])).includes(diffState.find.q)) diffState.find.matches.push(ri);
  }
  if (diffState.find.matches.length) { diffState.find.idx = 0; diffFindJump(0); }
  else $("#diff-tbinfo") && ($("#diff-tbinfo").textContent = "no matches");
}
function diffFindJump(dir) {
  const f = diffState.find;
  if (!f.matches.length) return;
  if (dir !== 0) f.idx = (f.idx + dir + f.matches.length) % f.matches.length;
  const ri = f.matches[f.idx];
  if (diffVSObj) diffVSObj.scrollToRow(ri, true);
  $("#diff-tbinfo") && ($("#diff-tbinfo").textContent = `match ${f.idx + 1}/${f.matches.length}`);
}

/* ── pulls tab ─────────────────────────────────────────── */
async function loadPullsSide() {
  const el = $("#pulls-side");
  try {
    const { pulls } = await api(`/api/${S.repo}/pulls`);
    el.innerHTML = pulls.map(p => `
      <div class="lrow" style="height:auto;padding:8px 10px;align-items:flex-start;flex-direction:column;gap:3px;cursor:default">
        <div style="display:flex;gap:8px;width:100%;align-items:center">
          <span class="badge">#${p.number}</span>
          <span class="grow" style="font-weight:600">${esc(p.title)}</span>
        </div>
        <div class="dim" style="font-size:11px">${esc(p.base_ref)} ← ${esc(p.head_ref)} · @${esc(p.user)} · ${esc(p.state)} · ${fmtRel(Math.floor(new Date(p.updated_at).getTime() / 1000))}</div>
      </div>`).join("") || '<div class="empty">no open pull requests</div>';
  } catch (e) { el.innerHTML = `<div class="empty">PR load failed<br><span class="dim">${esc(String(e))}</span><br><span class="dim">set GITHUB_TOKEN if rate-limited</span></div>`; }
}
function renderPullsMain(tb, c, hb) {
  tb.innerHTML = `<span class="dim">PULL REQUESTS</span><span class="grow"></span><span class="dim">open PRs from GitHub API</span>`;
  c.innerHTML = '<div class="empty" style="padding-top:80px">Pull requests are listed in the sidebar.<br><span class="dim">requires network + optional GITHUB_TOKEN</span></div>';
  hb.innerHTML = "";
}

/* ═══════════════ palette (Ctrl+P) ═══════════════ */
const pal = { open: false, items: [], sel: 0, tok: 0, all: null, lc: null, rendered: "" };
async function openPalette() {
  if (!S.repo) return;
  pal.open = true;
  $("#palette-ov").classList.add("open");
  document.getElementById("app").inert = true; // trap focus behind the overlay
  const inp = $("#palette-input");
  inp.value = "";
  inp.focus();
  pal.items = [];
  pal.sel = 0;
  renderPalette("");
  const tok = ++pal.tok;
  try {
    const files = await getFiles();
    if (tok !== pal.tok) return;
    pal.all = files;
    pal.lc = files.map(asciiLower); // precompute once per open
    renderPalette(inp.value);
  } catch (e) { $("#palette-list").innerHTML = `<div class="empty">${esc(String(e))}</div>`; }
}
function closePalette() {
  pal.open = false;
  $("#palette-ov").classList.remove("open");
  document.getElementById("app").inert = false;
}
function renderPalette(q, skipFilter) {
  const list = $("#palette-list");
  if (!pal.all) { list.innerHTML = '<div class="empty">loading file list…</div>'; return; }
  if (!skipFilter) {
    const items = q ? fuzzyFilter(pal.all, q, 100, pal.lc) : pal.all.slice(0, 100);
    pal.items = items;
    pal.rendered = items.map((p, i) => {
      const name = p.split("/").pop();
      const dir = p.slice(0, p.length - name.length - 1);
      return `<div class="prow" data-i="${i}"><span class="pd">${esc(dir)}${dir ? "/" : ""}</span><span class="pf">${esc(name)}</span></div>`;
    }).join("") || '<div class="empty">no matches</div>';
    list.innerHTML = pal.rendered;
    // one delegated handler instead of per-row
    list.onclick = (e) => {
      const row = e.target.closest(".prow");
      if (!row) return;
      const p = pal.items[+row.dataset.i];
      if (p) { closePalette(); openFile(p); }
    };
  }
  if (pal.sel >= pal.items.length) pal.sel = 0;
  // toggle .sel classes only — no re-filter, no innerHTML rebuild on nav
  list.querySelectorAll(".prow").forEach((x, k) => x.classList.toggle("sel", k === pal.sel));
}
let palDebounce = 0;
$("#palette-input").addEventListener("input", (e) => {
  pal.sel = 0;
  clearTimeout(palDebounce);
  palDebounce = setTimeout(() => renderPalette(e.target.value.trim()), 40);
});
$("#palette-input").addEventListener("keydown", (e) => {
  e.stopPropagation(); // keep global handlers (Ctrl+P toggle) from stealing nav keys
  if (e.key === "Escape") { closePalette(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p") { e.preventDefault(); closePalette(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); return; } // don't leak to browser find
  if (e.key === "Tab") { e.preventDefault(); return; } // trap: arrow keys navigate, no tab escape
  if (e.key === "ArrowDown" || (e.ctrlKey && e.key === "n")) { e.preventDefault(); pal.sel = Math.min(pal.sel + 1, pal.items.length - 1); renderPalette("", true); scrollPal(); }
  if (e.key === "ArrowUp" || (e.ctrlKey && e.key === "p")) { e.preventDefault(); pal.sel = Math.max(pal.sel - 1, 0); renderPalette("", true); scrollPal(); }
  if (e.key === "Enter") { const p = pal.items[pal.sel]; if (p) { closePalette(); openFile(p); } }
});
function scrollPal() { const el = $(`#palette-list .prow.sel`); if (el) el.scrollIntoView({ block: "nearest" }); }
$("#palette-ov").addEventListener("mousedown", (e) => { if (e.target === $("#palette-ov")) closePalette(); });
$("#btn-palette").onclick = openPalette;

/* ═══════════════ keyboard ═══════════════ */
addEventListener("keydown", (e) => {
  const inInput = e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA";
  if ((e.ctrlKey || e.metaKey) && (e.key === "p" || e.key === "P")) { e.preventDefault(); if (pal.open) closePalette(); else openPalette(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "f") {
    if (S.tab === "compare" && $("#diff-find")) { e.preventDefault(); $("#diff-find").focus(); $("#diff-find").select(); return; }
    if (S.tab === "search" && $("#search-q")) { e.preventDefault(); $("#search-q").focus(); $("#search-q").select(); return; }
    e.preventDefault(); // block native browser find — useless against virtualized lists
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); const box = $("#side-add"); box.style.display = "block"; $("#add-repo-input").focus(); return; }
  if (e.key === "Escape") {
    if (pal.open) { closePalette(); return; }
    if (inInput) { e.target.blur(); return; }
  }
  if (inInput || pal.open) return;
  if (e.key === "/") {
    e.preventDefault();
    if (S.tab === "files" && $("#tree-filter")) { $("#tree-filter").focus(); $("#tree-filter").select(); }
    else if (S.tab === "search" && $("#search-q")) { $("#search-q").focus(); $("#search-q").select(); }
    else if (S.tab === "compare" && $("#diff-filter")) { $("#diff-filter").focus(); $("#diff-filter").select(); }
    return;
  }
  const tabMap = { "1": "files", "2": "search", "3": "commits", "4": "compare", "5": "pulls" };
  if (tabMap[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey) { setTab(tabMap[e.key]); return; }
  if ((e.key === "j" || e.key === "k") && S.tab === "compare") {
    const side = $("#diff-side");
    const rows = side ? [...side.querySelectorAll(".lrow[data-i]")] : [];
    if (!rows.length) return;
    e.preventDefault();
    let idx = rows.findIndex(r => +r.dataset.i === diffState.sel);
    idx = e.key === "j" ? Math.min(idx + 1, rows.length - 1) : Math.max(idx - 1, 0);
    diffState.sel = +rows[idx].dataset.i;
    highlightDiffSide();
    showDiffFile(diffState.sel);
    $(`#diff-side .lrow[data-i="${diffState.sel}"]`)?.scrollIntoView({ block: "nearest" });
  }
  if ((e.key === "j" || e.key === "k") && S.tab === "search" && searchState.flat?.length) {
    e.preventDefault();
    let i = searchState.selIdx + (e.key === "j" ? 1 : -1);
    i = Math.max(0, Math.min(i, searchState.flat.length - 1));
    selectSearchHit(i);
    const el = $(`#search-hits .hit[data-i="${i}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
  }
  if ((e.key === "j" || e.key === "k") && S.tab === "commits") {
    const rows = [...document.querySelectorAll("#commits-main .lrow[data-cid]")];
    if (!rows.length) return;
    e.preventDefault();
    if (commitsState.selIdx == null) commitsState.selIdx = 0;
    commitsState.selIdx = Math.max(0, Math.min(commitsState.selIdx + (e.key === "j" ? 1 : -1), rows.length - 1));
    rows.forEach((r, i) => r.classList.toggle("sel", i === commitsState.selIdx));
    rows[commitsState.selIdx]?.scrollIntoView({ block: "nearest" });
  }
});

/* ═══════════════ sidebar resize ═══════════════ */
(() => {
  const rz = $("#side-resizer");
  let dragging = false;
  rz.addEventListener("mousedown", (e) => { dragging = true; rz.classList.add("drag"); e.preventDefault(); });
  addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const w = Math.max(180, Math.min(560, e.clientX - 44));
    document.documentElement.style.setProperty("--sbw", w + "px");
  });
  addEventListener("mouseup", () => { if (dragging) { dragging = false; rz.classList.remove("drag"); } });
})();

/* ═══════════════ boot ═══════════════ */
refreshStats();
refreshRepos().catch(e => toast(String(e)));
</script>
