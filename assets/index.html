<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xlr8</title>
<style>
  :root { --bg:#0d1117; --panel:#151a21; --panel2:#1c2129; --border:#2d333b; --fg:#e6edf3; --muted:#8b949e;
          --add:#2ea04329; --del:#f8514929; --addfg:#3fb950; --delfg:#f85149; --accent:#58a6ff;
          --warn:#d29922; --ok:#238636; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding-bottom:34px;
         font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  ::selection { background:#388bfd44; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:0s !important; animation-duration:0s !important; }
  }
  .badge, .cs, .stat, #perf, .fgut, .ln .n, .ln .n2,
  #commits-info, #diff-info, #search-info, .fig { font-variant-numeric:tabular-nums; }
  .fig { position:relative; border:1px dashed var(--border); margin:0 0 14px; padding:16px 12px 10px;
         background:var(--panel); font-family:var(--mono); font-size:12px; }
  .fig::before { content:attr(data-title); position:absolute; top:-8px; left:14px; padding:0 8px;
                 background:var(--bg); color:var(--muted); font-size:11px; letter-spacing:.6px; }
  .fig::after { content:"+"; position:absolute; right:-5px; bottom:-10px; color:var(--muted);
                background:var(--bg); padding:0 3px; font-size:12px; line-height:1; opacity:.7; }
  .fig .fig { margin-bottom:10px; }
  .fig .fig::before, .fig .fig::after { background:var(--panel); }
  .fig .toolbar { margin-bottom:10px; }
  .recede { opacity:.4; }
  .a { color:var(--addfg); } .d { color:var(--delfg); }
  .logo { font-family:var(--mono); font-size:18px; line-height:1; white-space:pre;
          color:var(--accent); letter-spacing:0; font-weight:700; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 20px;
           background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--accent); letter-spacing:.4px; font-weight:700; }
  nav { display:flex; gap:4px; }
  nav button { background:none; border:1px solid transparent; color:var(--muted); padding:5px 13px;
               cursor:pointer; border-radius:0; font:inherit; font-size:13px;
               transition:background-color .12s,color .12s,border-color .12s; }
  nav button:hover { color:var(--fg); }
  nav button.active { color:var(--fg); border-color:var(--border); background:var(--panel2); }
  #repo-label { font-size:12px; }
  #perf { position:fixed; left:0; right:0; bottom:0; display:flex; gap:14px; align-items:center;
          justify-content:center; padding:7px 16px; background:var(--panel); border-top:1px solid var(--border);
          font-family:var(--mono); font-size:12px; white-space:nowrap; overflow-x:auto; z-index:6; }
  #perf-lat { color:var(--accent); font-weight:600; min-width:54px; text-align:right; }
  main { padding:18px 20px; max-width:1200px; margin:0 auto; }
  select { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:0;
           padding:5px 8px; font:inherit; font-size:13px; transition:border-color .12s; }
  select:hover { border-color:var(--muted); }
  input[type="search"] { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:0;
           padding:5px 9px; font:inherit; font-size:13px; transition:border-color .12s; }
  input[type="search"]:focus { border-color:var(--accent); outline:none; }
  .toolbar { display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
  .toolbar button { background:var(--panel2); color:var(--fg); border:1px solid var(--border);
                    border-radius:0; padding:5px 14px; cursor:pointer; font:inherit; font-size:13px;
                    transition:background-color .12s,border-color .12s; }
  .toolbar button:hover { border-color:var(--muted); background:#21262d; }
  #diff-btn { background:var(--ok); border-color:#2ea04366; }
  #diff-btn:hover { background:#2ea043; border-color:#2ea043; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:0;
          margin-bottom:10px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .card-h { padding:9px 14px; border-bottom:1px solid var(--border); display:flex; gap:10px;
            align-items:center; cursor:pointer; font-family:var(--mono); font-size:13px;
            transition:background-color .12s; }
  .card-h:hover { background:var(--panel2); }
  .stat { margin-left:auto; font-size:12px; }
  .stat .a { color:var(--addfg); } .stat .d { color:var(--delfg); }
  .cs { font-size:11px; font-variant-numeric:tabular-nums; }
  .cs:empty { display:none; }
  .cs .a { color:var(--addfg); } .cs .d { color:var(--delfg); }
  .fview { font-family:var(--mono); font-size:12px; padding:6px 0; }
  .frow { display:flex; gap:10px; padding:0 12px; line-height:20px; }
  .fgut { min-width:40px; text-align:right; color:var(--muted); user-select:none; flex-shrink:0; }
  .ftxt { flex:1; white-space:pre-wrap; word-break:break-all; }
  .fsep { opacity:.55; }
  mark { background:rgba(240,180,50,.28); color:inherit; border-radius:0; }
  .status { width:18px; text-align:center; font-weight:700; font-family:var(--mono); }
  .status.A { color:var(--addfg); } .status.D { color:var(--delfg); } .status.M { color:var(--warn); } .status.R { color:var(--accent); }
  .mono { color:var(--muted); font-size:12px; font-family:var(--mono); }
  /* windowed rows: only the viewport slice is in the DOM, positions are
     absolute against total height — fixed row heights keep the math exact */
  .vlines { position:relative; overflow-x:auto; }
  .vlines > * { position:absolute; left:0; width:max-content; min-width:100%; }
  .ln { display:flex; white-space:pre; height:22px; line-height:22px;
        font-family:var(--mono); font-size:12.5px; }
  .ln .n, .ln .n2 { width:48px; flex:none; text-align:right; padding-right:8px; color:var(--muted);
                    user-select:none; background:#0d1117cc; position:sticky; }
  .ln .n { left:0; }
  .ln .n2 { left:48px; border-right:1px solid var(--border); }
  .ln .t { padding-left:8px; }
  .ln.add { background:var(--add); } .ln.add .t { color:var(--addfg); }
  .ln.del { background:var(--del); } .ln.del .t { color:var(--delfg); }
  .hunk-h { background:var(--panel2); color:var(--accent); padding:3px 10px; font-size:12px; line-height:19px;
            height:27px; overflow:hidden; box-sizing:border-box;
            font-family:var(--mono); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .gap { text-align:center; color:var(--muted); background:#21262d; padding:4px; font-size:12px; line-height:19px;
         height:27px; overflow:hidden; box-sizing:border-box; }
  .file-meta { padding:6px 14px; color:var(--muted); font-size:12px; }
  .file-loading { padding:8px 14px; color:var(--muted); font-size:13px; }
  .card.open .card-h { background:var(--panel2); }
  .row { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; gap:12px;
         align-items:baseline; font-size:13px; transition:background-color .12s; }
  .row:hover { background:#1c212980; }
  .row:last-child { border-bottom:none; }
  .row .sha { color:var(--accent); cursor:pointer; font-family:var(--mono); }
  .badge { background:#21262d; border:1px solid var(--border); border-radius:0; padding:1px 9px;
           font-size:12px; color:var(--muted); font-family:var(--mono); }
  .muted { color:var(--muted); }
  #toast { position:fixed; bottom:44px; right:16px; background:var(--panel2); border:1px solid var(--border);
           padding:9px 15px; border-radius:0; display:none; font-family:var(--mono); font-size:13px;
           box-shadow:0 6px 20px rgba(0,0,0,.45); }
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-label="xlr8">[ xlr8 ]</span></h1>
  <nav>
    <button data-tab="commits" class="active">Commits</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="search">Search</button>
    <button data-tab="pulls">Pulls</button>
  </nav>
  <span id="repo-label" class="muted"></span>
</header>
<main>
  <div class="toolbar fig" id="repo-bar" data-title="[ REPO ]" style="display:none">
    <span class="muted">repo:</span>
    <select id="repo-select"></select>
    <button id="sync-btn">sync</button>
    <span class="muted" id="sync-age"></span>
  </div>

  <section id="tab-commits">
    <div class="fig" data-title="[ COMMITS ]">
    <div class="toolbar">
      <select id="commits-ref"></select>
      <select id="commits-size" title="commits per page">
        <option>25</option>
        <option selected>50</option>
        <option>100</option>
        <option>200</option>
      </select>
      <button id="commits-prev" title="previous page">‹</button>
      <span class="muted" id="commits-info"></span>
      <button id="commits-next" title="next page">›</button>
    </div>
    <div id="commits-fig"></div>
    <div id="commits-list"></div>
    </div>
  </section>

  <section id="tab-compare" style="display:none">
    <div class="fig" data-title="[ COMPARE ]">
    <div class="toolbar">
      <select id="base-ref"></select><span class="muted">...</span><select id="head-ref"></select>
      <button id="diff-btn">diff</button>
      <input id="diff-find" type="search" placeholder="find in diff" style="width:140px" />
      <input id="diff-filter" type="search" placeholder="filter files" style="width:130px" />
      <span class="muted" id="diff-info"></span>
    </div>
    <div id="diff-summary"></div>
    </div>
  </section>

  <section id="tab-pulls" style="display:none">
    <div class="fig" data-title="[ PULLS ]">
    <div id="pulls-list"><span class="muted">loading…</span></div>
    </div>
  </section>

  <section id="tab-search" style="display:none">
    <div class="fig" data-title="[ SEARCH ]">
    <div class="toolbar">
      <select id="search-ref"></select>
      <input id="search-q" type="search" placeholder="words in paths · ext:rs · grep:text · -negate" style="flex:1;min-width:140px" />
      <span class="muted" id="search-info"></span>
    </div>
    <div id="search-view" style="display:none"></div>
    <div id="search-results"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<div id="perf" title="spark = last 40 request round trips (client-measured) · ram/cpu/up/cache/synced from /api/stats every 2 s (paused when tab hidden)">
  <span id="perf-spark" class="muted"></span>
  <span id="perf-lat">—</span>
  <span id="perf-stats" class="muted"></span>
</div>

<script>
let repo = null; // "owner/name"

const $ = (s) => document.querySelector(s);
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3000); };

const fmtBytes = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
const fmtDur = (s) => s < 120 ? s + "s" : s < 7200 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h";

// live bottom bar: stats polled every 2 s (only ~1 ms of server work, paused
// when the tab is hidden), uptime ticks locally every 1 s — no server cost
let lastS = null, fetchedAt = 0;
const meter = (frac, n = 12) => {
  const f = Math.round(Math.min(1, Math.max(0, frac)) * n);
  return "=".repeat(f) + "-".repeat(n - f);
};
function renderStats() {
  if (!lastS) return;
  const drift = Math.floor((Date.now() - fetchedAt) / 1000);
  const up = lastS.uptime_s + drift;
  const synced = lastS.synced_s ? lastS.synced_s + drift : 0;
  $("#perf-stats").textContent =
    "ram " + fmtBytes(lastS.rss) + " · cpu " + (lastS.cpu_ms / 1000).toFixed(1) + "s" +
    " · up " + fmtDur(up) + " · cache [" + meter(lastS.cache_bytes / (32 << 20)) + "] " +
    fmtBytes(lastS.cache_bytes) + "/32m";
  $("#sync-age").textContent = synced ? "synced " + fmtDur(synced) + " ago" : "";
}
function refreshStats() {
  if (document.hidden) return;
  fetch("/api/stats").then(r => r.ok ? r.json() : null).then(s => {
    if (!s) return;
    lastS = s;
    fetchedAt = Date.now();
    renderStats();
  }).catch(() => {});
}
// sparkline of the last 40 round trips — block glyphs, max-scaled, no server
const LAT = [], SPARK_CH = "▁▂▃▄▅▆▇█";
const mark = (ms) => {
  LAT.push(ms);
  if (LAT.length > 40) LAT.shift();
  const mx = Math.max(...LAT, 1);
  $("#perf-spark").textContent = LAT.map(v => SPARK_CH[Math.min(7, Math.floor(v / mx * 7.999))]).join("");
  $("#perf-lat").textContent = (ms >= 100 ? Math.round(ms) : ms.toFixed(1)) + "ms";
  refreshStats();
};
setInterval(refreshStats, 2000);
setInterval(renderStats, 1000);
const api = async (path) => {
  const t0 = performance.now();
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  const j = await r.json();
  mark(performance.now() - t0);
  return j;
};

// tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll("main > section").forEach(s =>
    s.style.display = s.id === "tab-" + b.dataset.tab ? "" : "none");
  if (b.dataset.tab === "pulls") loadPulls();
  if (b.dataset.tab === "search") $("#search-q").focus();
});

async function refreshRepos() {
  const { repos } = await api("/api/repos");
  const sel = $("#repo-select");
  sel.innerHTML = "";
  repos.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; sel.appendChild(o); });
  $("#repo-bar").style.display = repos.length ? "flex" : "none";
  if (repos.length && !repo) { repo = repos[0]; sel.value = repo; onRepoChange(); }
  else if (repo) { sel.value = repo; }
}

function onRepoChange() {
  $("#repo-label").textContent = repo || "";
  // drop everything belonging to the previous repo so no stale data shows
  vclose($("#diff-summary")); $("#diff-summary").innerHTML = "";
  $("#diff-info").textContent = "";
  $("#pulls-list").innerHTML = '<span class="muted">loading…</span>';
  commitsPage = 1;
  commitTotal = null;
  $("#search-results").innerHTML = "";
  $("#search-view").style.display = "none";
  $("#search-info").textContent = "";
  loadRefs().then(() => {
    loadCommits();
    if ($("#search-q").value.trim()) doSearch();
    const pullsTab = document.querySelector('nav button[data-tab="pulls"]');
    if (pullsTab && pullsTab.classList.contains("active")) loadPulls();
  });
}

$("#repo-select").onchange = (e) => { repo = e.target.value; onRepoChange(); };
$("#sync-btn").onclick = async () => {
  if (!repo) return;
  toast("syncing…");
  fetch("/api/sync", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ repo }) })
    .then(r => r.ok ? (toast("synced"), onRepoChange()) : r.text().then(t => toast("error: " + t)))
    .catch(e => toast("error: " + e));
};

async function loadRefs() {
  const { refs } = await api(`/api/${repo}/refs`);
  // default branch first, then alphabetical — alphabetical alone put ancient
  // tags (bisect, gitgui-0.10.0…) on top and the whole list looked old-first
  const pref = ["main", "master"];
  const rank = (n) => { const i = pref.indexOf(n); return i < 0 ? pref.length : i; };
  refs.sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name));
  for (const id of ["commits-ref","base-ref","head-ref","search-ref"]) {
    const sel = $("#" + id); sel.innerHTML = "";
    refs.forEach(r => { const o = document.createElement("option"); o.value = r.name; o.textContent = r.name; sel.appendChild(o); });
  }
  const names = refs.map(r => r.name);
  if (names.includes("main")) $("#base-ref").value = "main";
  else if (names.includes("master")) $("#base-ref").value = "master";
  // GitHub-style default: base == head ("up to date") until the user picks
  $("#head-ref").value = $("#base-ref").value;
}

let commitsTok = 0;
let commitsPage = 1;
let commitTotal = null;          // total commits on ref, from count=1 (cached)
let commitsLoaded = 0;
function renderCommitsInfo() {
  const limit = +$("#commits-size").value;
  const pages = commitTotal == null ? 0 : Math.max(1, Math.ceil(commitTotal / limit));
  $("#commits-info").textContent = pages
    ? `page ${commitsPage}/${pages} · ${commitTotal.toLocaleString()} commits`
    : `page ${commitsPage} · ${commitsLoaded} commits`;
  $("#commits-prev").disabled = commitsPage <= 1;
  $("#commits-next").disabled = pages ? commitsPage >= pages : commitsLoaded < limit;
}
// activity strip + author rank from the loaded page — pure client math on
// data we already fetched, one small DOM subtree
function renderCommitsFig(commits) {
  const el = $("#commits-fig");
  if (!commits.length) { el.innerHTML = ""; return; }
  const byDay = new Map();
  for (const c of commits) {
    const k = Math.floor(c.time / 86400);
    byDay.set(k, (byDay.get(k) || 0) + 1);
  }
  const ks = [...byDay.keys()].sort((a, b) => a - b);
  const hi = ks[ks.length - 1];
  const span = Math.min(hi - ks[0] + 1, 60);
  const mx = Math.max(...byDay.values());
  let strip = "";
  for (let k = hi - span + 1; k <= hi; k++) {
    const v = byDay.get(k) || 0;
    strip += v ? SPARK_CH[Math.min(7, Math.floor(v / mx * 7.999))] : " ";
  }
  const iso = (k) => new Date(k * 86400 * 1000).toISOString().slice(0, 10);
  const authors = new Map();
  for (const c of commits) authors.set(c.author, (authors.get(c.author) || 0) + 1);
  const top = [...authors].sort((a, b) => b[1] - a[1]).slice(0, 3);
  const amx = top.length ? top[0][1] : 1;
  el.innerHTML = `<div class="fig" data-title="[ ACTIVITY ]">${strip}
    <div class="muted" style="margin-top:5px">${iso(hi - span + 1)} → ${iso(hi)} · ${commits.length} commits</div>
    ${top.map(([n, v], i) => `<div style="display:flex;gap:10px;margin-top:${i ? 2 : 8}px"${i ? ' class="recede"' : ""}>
      <span style="min-width:110px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(n)}</span>
      <span>${"█".repeat(Math.max(1, Math.round(v / amx * 12)))}</span><span class="muted">${v}</span></div>`).join("")}
  </div>`;
}
async function loadCommits() {
  const tok = ++commitsTok;
  const ref = $("#commits-ref").value;
  const limit = +$("#commits-size").value;
  const page = commitsPage;
  const q = `limit=${limit}&page=${page}&ref=${encodeURIComponent(ref)}`;
  const { commits } = await api(`/api/${repo}/commits?${q}`);
  if (tok !== commitsTok) return;
  commitsLoaded = commits.length;
  renderCommitsInfo();
  renderCommitsFig(commits);
  $("#commits-list").innerHTML = commits.map(c => `
    <div class="card"><div class="row" data-cid="${c.id}">
      <span class="sha" data-sha="${c.id}">${c.short_id}</span>
      <span>${escapeHtml(c.summary)}</span>
      <span class="badge cs"></span>
      <span class="muted" style="margin-left:auto">${escapeHtml(c.author)} · ${new Date(c.time*1000).toLocaleString()}</span>
    </div></div>`).join("");
  document.querySelectorAll(".sha").forEach(el => el.onclick = () => {
    setRef("base-ref", el.dataset.sha + "^", el.textContent + "^");
    setRef("head-ref", el.dataset.sha, el.textContent);
    document.querySelector('nav button[data-tab="compare"]').click();
    $("#diff-btn").click();
  });
  // +/− per commit: separate cached request so this first paint stays ~20 ms;
  // numbers pop in when ready (never blocks the list)
  api(`/api/${repo}/commits?${q}&stats=1`).then(({ commits: ws }) => {
    if (tok !== commitsTok) return;
    const m = new Map(ws.map(c => [c.id, c]));
    document.querySelectorAll("#commits-list .row[data-cid]").forEach(el => {
      const c = m.get(el.dataset.cid);
      if (c) el.querySelector(".cs").innerHTML =
        `<span class="a">+${c.additions}</span> <span class="d">−${c.deletions}</span>`;
    });
  }).catch(() => {});
  // page total: one cached full-history walk per ref, also background
  if (commitTotal === null) {
    api(`/api/${repo}/commits?ref=${encodeURIComponent(ref)}&count=1`).then(r => {
      if (tok !== commitsTok) return;
      commitTotal = r.count;
      renderCommitsInfo();
    }).catch(() => {});
  }
}
$("#commits-ref").onchange = () => { commitsPage = 1; commitTotal = null; loadCommits(); };
$("#commits-size").onchange = () => { commitsPage = 1; loadCommits(); };
$("#commits-prev").onclick = () => { if (commitsPage > 1) { commitsPage--; loadCommits(); } };
$("#commits-next").onclick = () => { commitsPage++; loadCommits(); };

function setRef(selId, value, label) {
  const sel = $("#" + selId);
  if (![...sel.options].some(o => o.value === value)) {
    const o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    sel.appendChild(o);
  }
  sel.value = value;
}

let searchTok = 0, searchDeb = 0, searchTerms = [], searchRef = "";
function highlight(text, terms) {
  const marks = [];
  const low = text.toLowerCase();
  for (const t of terms) {
    if (!t) continue;
    let i = 0, j;
    while ((j = low.indexOf(t, i)) !== -1) { marks.push([j, j + t.length]); i = j + t.length; }
  }
  if (!marks.length) return escapeHtml(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = [marks[0]];
  for (const m of marks.slice(1)) {
    const last = merged[merged.length - 1];
    if (m[0] <= last[1]) last[1] = Math.max(last[1], m[1]);
    else merged.push(m);
  }
  let out = "", pos = 0;
  for (const [s, e] of merged) { out += escapeHtml(text.slice(pos, s)) + "<mark>" + escapeHtml(text.slice(s, e)) + "</mark>"; pos = e; }
  return out + escapeHtml(text.slice(pos));
}
async function openBlob(path) {
  const el = $("#search-view");
  el.style.display = "block";
  el.innerHTML = '<span class="muted">loading…</span>';
  try {
    const b = await api(`/api/${repo}/blob?ref=${encodeURIComponent(searchRef)}&path=${encodeURIComponent(path)}`);
    const body = b.binary ? '<span class="muted">binary file</span>' : fileView(b.text, searchTerms);
    el.innerHTML = `<div class="fig" data-title="[ FILE ]" style="margin-top:0">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">
          <b style="font-size:13px">${escapeHtml(path)}</b>
          <span class="muted">${b.truncated ? "truncated" : ""}</span></div>${body}</div>`;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { el.innerHTML = `<span class="muted">${escapeHtml(String(e))}</span>`; }
}
// snippet caps: one rendered view stays at one open-diff-file's worth of rows
const FILE_CTX = 2, FILE_MAX_HUNKS = 120, FILE_MAX_LINES = 200, FILE_LINE_MAX = 400;
function fileView(text, terms) {
  const lines = text.split("\n");
  const cut = (l) => l.length > FILE_LINE_MAX ? l.slice(0, FILE_LINE_MAX) + "…" : l;
  if (!terms.length) {
    const shown = lines.slice(0, FILE_MAX_LINES)
      .map((l, i) => `<div class="frow"><span class="fgut">${i + 1}</span><span class="ftxt">${escapeHtml(cut(l))}</span></div>`).join("");
    const more = lines.length > FILE_MAX_LINES
      ? `<div class="muted" style="padding:6px 12px">… first ${FILE_MAX_LINES} of ${lines.length} lines</div>` : "";
    return `<div class="fview">${shown}</div>${more}`;
  }
  const tl = terms.map(t => t.toLowerCase()).filter(Boolean);
  const keep = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].toLowerCase();
    if (tl.some(t => l.includes(t))) keep.push(i);
  }
  if (!keep.length) {
    return fileView(text, []); // terms matched the path, not the content
  }
  const hunks = [];
  for (const i of keep) {
    const s = Math.max(0, i - FILE_CTX), e = Math.min(lines.length - 1, i + FILE_CTX);
    const last = hunks[hunks.length - 1];
    if (last && s <= last.e + 1) last.e = e;
    else hunks.push({ s, e });
  }
  const shown = hunks.slice(0, FILE_MAX_HUNKS);
  const parts = [];
  for (let h = 0; h < shown.length; h++) {
    if (h) parts.push(`<div class="frow fsep"><span class="fgut">⋯</span><span class="ftxt"></span></div>`);
    for (let i = shown[h].s; i <= shown[h].e; i++)
      parts.push(`<div class="frow"><span class="fgut">${i + 1}</span><span class="ftxt">${highlight(cut(lines[i]), terms)}</span></div>`);
  }
  const more = hunks.length > shown.length
    ? `<div class="muted" style="padding:6px 12px">… ${hunks.length - shown.length} more hunks</div>` : "";
  return `<div class="fview">${parts.join("")}</div>${more}`;
}
async function doSearch() {
  const q = $("#search-q").value.trim();
  const tok = ++searchTok;
  $("#search-view").style.display = "none";
  if (!repo || !q) { $("#search-info").textContent = ""; $("#search-results").innerHTML = ""; return; }
  searchRef = $("#search-ref").value;
  try {
    const r = await api(`/api/${repo}/search?ref=${encodeURIComponent(searchRef)}&q=${encodeURIComponent(q)}`);
    if (tok !== searchTok) return;
    searchTerms = q.split(/\s+/)
      .filter(t => t && !t.startsWith("-") && !/^(ext|grep|content):/i.test(t))
      .map(t => t.toLowerCase())
      .concat(q.split(/\s+/).filter(t => /^(grep|content):/i.test(t)).map(t => t.split(":").slice(1).join(":").toLowerCase()));
    $("#search-info").textContent =
      `${r.files} file${r.files === 1 ? "" : "s"} · ${r.matches.length} match${r.matches.length === 1 ? "" : "es"} · ${r.took_ms} ms${r.truncated ? " · partial" : ""}`;
    const rows = [];
    for (const f of (r.hits || []).slice(0, 100))
      rows.push(`<div class="card row" data-p="${escapeAttr(f.path)}" style="cursor:pointer">
        <span style="font-family:var(--mono);font-size:12px">${escapeHtml(f.path)}</span>
        <span class="badge" style="margin-left:auto">${f.score}</span></div>`);
    const byPath = new Map();
    for (const m of r.matches) {
      if (!byPath.has(m.path)) byPath.set(m.path, []);
      byPath.get(m.path).push(m);
    }
    for (const [path, ms] of byPath)
      rows.push(`<div class="card" data-p="${escapeAttr(path)}" style="cursor:pointer">
        <div class="row" style="padding:8px 14px;border-bottom:1px solid var(--border)">
          <span style="font-family:var(--mono);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(path)}</span>
          <span class="badge">${ms.length} line${ms.length === 1 ? "" : "s"}</span></div>
        ${ms.map(m => `<div class="row" style="padding:5px 14px;gap:10px;font-family:var(--mono);font-size:12px">
          <span class="muted" style="min-width:36px;text-align:right">${m.line}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.text)}</span></div>`).join("")}
      </div>`);
    $("#search-results").innerHTML = rows.join("");
    $("#search-results").querySelectorAll("[data-p]").forEach(el => el.onclick = () => openBlob(el.dataset.p));
  } catch (e) {
    if (tok === searchTok) $("#search-info").textContent = String(e);
  }
}
$("#search-q").addEventListener("input", () => { clearTimeout(searchDeb); searchDeb = setTimeout(doSearch, 250); });
$("#search-ref").onchange = doSearch;

// ---- in-app find (Ctrl+F) across virtualized diff rows ---------------------
let diffFilesCache = [];
let findMatches = [], findIdx = -1, findTerm = "";
function renderDiffFiles(files) {
  diffFilesCache = files;
  const filter = $("#diff-filter").value.trim().toLowerCase();
  const shown = filter ? files.filter(f => f.path.toLowerCase().includes(filter)) : files;
  $("#diff-summary").querySelectorAll(".card").forEach(el => el.remove());
  const html = shown.map(f => `
      <div class="card"><div class="card-h" data-path="${escapeAttr(f.path)}" data-opath="${escapeAttr(f.old_path || "")}">
        <span class="status ${f.status}">${f.status}</span>
        <span>${escapeHtml(f.path)}</span>
        ${f.old_path && f.old_path !== f.path ? `<span class="muted">← ${escapeHtml(f.old_path)}</span>` : ""}
        <span class="stat">${f.binary ? '<span class="muted">binary</span>' : `<span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span>`}</span>
      </div></div>`).join("");
  $("#diff-summary").insertAdjacentHTML("beforeend", html);
}
$("#diff-filter").addEventListener("input", () => {
  if (diffFilesCache.length) renderDiffFiles(diffFilesCache);
});
function diffFind(q) {
  findMatches = []; findIdx = -1; findTerm = q.toLowerCase();
  if (!findTerm) { $("#diff-info").textContent = diffInfoLast; return; }
  for (let vi = 0; vi < VREG.length; vi++) {
    const e = VREG[vi];
    if (!e || !e.rows) continue;
    for (let ri = 0; ri < e.rows.length; ri++) {
      const r = e.rows[ri];
      if (r[0] !== "h" && r[0] !== "g" && String(r[3]).toLowerCase().includes(findTerm)) {
        findMatches.push({ vi, ri });
      }
    }
  }
  if (findMatches.length) {
    findIdx = 0;
    jumpToMatch();
  } else {
    $("#diff-info").textContent = "no matches";
  }
}
function jumpToMatch() {
  if (findIdx < 0 || findIdx >= findMatches.length) return;
  const m = findMatches[findIdx];
  const e = VREG[m.vi];
  if (!e || !e.tops) return;
  // scroll so the match is centered
  const box = document.querySelector(`.vlines[data-v="${m.vi}"]`);
  if (box) {
    voff(box);
    const target = box._off + e.tops[m.ri] - innerHeight / 2 + 11;
    scrollTo({ top: Math.max(0, target), behavior: "smooth" });
  }
  $("#diff-info").textContent = `match ${findIdx + 1}/${findMatches.length}`;
}
$("#diff-find").addEventListener("input", () => {
  clearTimeout(window._findDeb);
  window._findDeb = setTimeout(() => diffFind($("#diff-find").value.trim()), 200);
});
$("#diff-find").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (findMatches.length) {
      findIdx = e.shiftKey ? (findIdx - 1 + findMatches.length) % findMatches.length
                           : (findIdx + 1) % findMatches.length;
      jumpToMatch();
    }
  }
  if (e.key === "Escape") { $("#diff-find").value = ""; diffFind(""); }
});
// Ctrl+F focuses the in-app find when the compare tab is visible
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "f") {
    const cmp = $("#tab-compare");
    if (cmp && cmp.style.display !== "none") {
      e.preventDefault();
      $("#diff-find").focus();
      $("#diff-find").select();
    }
    return;
  }
  // don't hijack keys while typing in inputs
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  // / focuses the file filter in compare view
  if (e.key === "/" && $("#tab-compare").style.display !== "none") {
    e.preventDefault();
    $("#diff-filter").focus();
    $("#diff-filter").select();
    return;
  }
  // tab shortcuts: 1=commits 2=compare 3=search 4=pulls
  const tabMap = { "1": "commits", "2": "compare", "3": "search", "4": "pulls" };
  if (tabMap[e.key]) {
    document.querySelector(`nav button[data-tab="${tabMap[e.key]}"]`).click();
    return;
  }
  // j/k: expand/collapse next/prev file card in compare view
  if ((e.key === "j" || e.key === "k") && $("#tab-compare").style.display !== "none") {
    const cards = [...document.querySelectorAll("#diff-summary .card-h[data-path]")];
    if (!cards.length) return;
    e.preventDefault();
    const openIdx = cards.findIndex(c => c.parentElement.classList.contains("open"));
    const next = e.key === "j"
      ? (openIdx < cards.length - 1 ? openIdx + 1 : 0)
      : (openIdx > 0 ? openIdx - 1 : cards.length - 1);
    // close current open file
    const cur = document.querySelector("#diff-summary .card.open .file-body");
    if (cur) { vclose(cur); cur.remove(); cur.parentElement.classList.remove("open"); }
    toggleFile(cards[next]);
    cards[next].scrollIntoView({ block: "nearest" });
  }
});
let diffInfoLast = "";
$("#diff-btn").onclick = async () => {
  const base = $("#base-ref").value, head = $("#head-ref").value;
  $("#diff-info").textContent = "computing…";
  const t0 = performance.now();
  try {
    const s = await api(`/api/${repo}/diff?base=${encodeURIComponent(base)}&head=${encodeURIComponent(head)}`);
    diffInfoLast = `${s.files.length} files  +${s.total_additions} −${s.total_deletions}  (${Math.round(performance.now()-t0)}ms)`;
    $("#diff-info").textContent = diffInfoLast;
    diffBase = base; diffHead = head;
    vclose($("#diff-summary"));
    $("#diff-filter").value = ""; $("#diff-find").value = "";
    findMatches = []; findIdx = -1;
    const tot = s.total_additions + s.total_deletions || 1;
    const share = Math.round(s.total_additions / tot * 12);
    $("#diff-summary").innerHTML =
      `<div class="fig" data-title="[ CHANGES ]">${escapeHtml(base)} → ${escapeHtml(head)}<br>
        <span class="a">+${s.total_additions}</span> <span class="d">−${s.total_deletions}</span>
        · ${s.files.length} files · add [${"=".repeat(share)}${"-".repeat(12 - share)}]<br>
        <span class="muted">computed ${Math.round(performance.now() - t0)} ms · click a file to expand</span></div>`;
    renderDiffFiles(s.files);
  } catch (e) {
    $("#diff-info").textContent = "";
    toast("diff failed: " + e.message);
  }
};

// file diffs expand inside their own card (one delegated listener instead of
// per-card handlers; the windowed .vlines slice keeps off-screen rows out of
// the DOM — no jump to page bottom like the old footer container)
let diffBase = "", diffHead = "";
$("#diff-summary").addEventListener("click", (e) => {
  const h = e.target.closest(".card-h[data-path]");
  if (h) toggleFile(h);
});

async function toggleFile(h) {
  const card = h.parentElement;
  const open = card.querySelector(".file-body");
  if (open) { vclose(open); open.remove(); card.classList.remove("open"); vshift(); return; }
  const body = document.createElement("div");
  body.className = "file-body";
  body.innerHTML = '<div class="file-loading">loading…</div>';
  card.appendChild(body);
  card.classList.add("open");
  vshift();
  let u = `/api/${repo}/file?base=${encodeURIComponent(diffBase)}&head=${encodeURIComponent(diffHead)}&path=${encodeURIComponent(h.dataset.path)}`;
  if (h.dataset.opath && h.dataset.opath !== h.dataset.path) u += `&old_path=${encodeURIComponent(h.dataset.opath)}`;
  try {
    const fd = await api(u);
    if (!body.isConnected) return; // new diff ran while fetching
    body.innerHTML = fileBody(fd, h.dataset.path);
    vmount(body);
  } catch (e) {
    if (body.isConnected) body.innerHTML = `<div class="file-loading">failed: ${escapeHtml(e.message)}</div>`;
  }
}

// ---- windowed diff rendering ------------------------------------------------
// rows live in JS (tops = prefix-sum of fixed heights); the DOM holds only the
// viewport slice ± 600 px per open file, so 10 × 20k-line diffs cost ~600
// nodes each and open instantly — full-list DOM would be ~800k nodes.
const VREG = [];                                   // {rows, tops}
const vboxes = new Set();                          // mounted .vlines elements
const V_H = [22, 27, 27];                          // ln / hunk / gap px (CSS-synced)
let vframe = 0;

function vmount(scope) {
  const box = scope.querySelector(".vlines");
  if (!box) return;
  vboxes.add(box);
  vshift();                                          // re-offsets all, renders next frame
}
function vclose(scope) {
  for (const b of scope.querySelectorAll(".vlines")) {
    vboxes.delete(b);
    const e = VREG[b.dataset.v | 0];
    if (e) { e.rows = null; e.tops = null; }        // free the row data
  }
}
function voff(box) { box._off = box.getBoundingClientRect().top + scrollY; }
function vshift() { vboxes.forEach(voff); vpump(); }   // expand/collapse moves every box below
function vpump() {
  if (vframe) return;
  vframe = requestAnimationFrame(() => { vframe = 0; vboxes.forEach(vslice); });
}
function vfind(tops, x) {                          // first idx with tops[idx] >= x
  let lo = 0, hi = tops.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (tops[m] < x) lo = m + 1; else hi = m; }
  return lo;
}
function vslice(box) {
  const e = VREG[box.dataset.v | 0];
  if (!e || !e.rows) return;
  const start = scrollY - box._off - 600, end = scrollY - box._off + innerHeight + 600;
  if (end < 0 || start > e.tops[e.rows.length]) return;   // fully offscreen
  const i = Math.max(0, vfind(e.tops, start) - 1);
  const j = Math.min(e.rows.length, vfind(e.tops, end) + 1);
  if (box._i === i && box._j === j) return;
  let html = "";
  for (let k = i; k < j; k++) html += vrow(e.rows[k], e.tops[k]);
  box.innerHTML = html;
  box._i = i; box._j = j;
}
function vrow(r, top) {
  if (r[0] === "h") return `<div class="hunk-h" style="top:${top}px">${r[1]}</div>`;
  if (r[0] === "g") return `<div class="gap" style="top:${top}px">${r[1]}</div>`;
  return `<div class="ln ${r[0]}" style="top:${top}px">
    <span class="n">${r[1]}</span><span class="n2">${r[2]}</span><span class="t">${escapeHtml(r[3]) || " "}</span></div>`;
}
addEventListener("scroll", vpump, { passive: true });
addEventListener("resize", () => { vboxes.forEach(voff); vpump(); });

function fileBody(fd, path) {
  if (fd.binary) return `<div class="file-meta">${escapeHtml(path)} — binary file</div>`;
  if (!fd.hunks.length) return `<div class="file-meta">no textual changes</div>`;
  const rows = [];
  let prev = null;
  for (const h of fd.hunks) {
    const gapOld = prev ? h.old_start - (prev.old_start + prev.old_count) : (h.old_count ? h.old_start - 1 : h.old_start);
    const gapNew = prev ? h.new_start - (prev.new_start + prev.new_count) : (h.new_count ? h.new_start - 1 : h.new_start);
    const gap = Math.max(gapOld, gapNew, 0);
    if (gap > 0) rows.push(["g", `⋯ ${gap} lines unchanged`]);
    rows.push(["h", `@@ -${h.old_start},${h.old_count} +${h.new_start},${h.new_count} @@`]);
    let o = h.old_start, n = h.new_start;
    for (const l of h.lines) {
      let oc = "", nc = "";
      if (l.kind === "del") oc = o++;
      else if (l.kind === "add") nc = n++;
      else { oc = o++; nc = n++; }
      rows.push([l.kind === "add" ? "add" : l.kind === "del" ? "del" : "", oc, nc, l.text]);
    }
    prev = h;
  }
  const tops = new Int32Array(rows.length + 1);
  for (let k = 0; k < rows.length; k++) tops[k + 1] = tops[k] + V_H[rows[k][0] === "h" ? 1 : rows[k][0] === "g" ? 2 : 0];
  const idx = VREG.push({ rows, tops }) - 1;
  const total = fd.hunks.reduce((s, h) => s + h.lines.length, 0);
  return `<div class="file-meta">${fd.hunks.length} hunks · ${total} lines</div>
    <div class="vlines" data-v="${idx}" style="height:${tops[rows.length]}px"></div>`;
}

async function loadPulls() {
  try {
    const { pulls } = await api(`/api/${repo}/pulls`);
    $("#pulls-list").innerHTML = pulls.map(p => `
      <div class="card"><div class="row">
        <span class="badge">#${p.number}</span>
        <span>${escapeHtml(p.title)}</span>
        <span class="muted" style="margin-left:auto">@${escapeHtml(p.user)} <span class="badge">${p.state}</span></span>
      </div>
      <div class="row"><span class="mono">${escapeHtml(p.base_ref)} ← ${escapeHtml(p.head_ref)}</span>
      <span class="muted" style="margin-left:auto">${new Date(p.updated_at).toLocaleString()}</span></div></div>`).join("")
      || '<span class="muted">no open pull requests</span>';
  } catch (e) { $("#pulls-list").innerHTML = `<span class="muted">PR load failed: ${escapeHtml(String(e))} (set GITHUB_TOKEN if rate-limited)</span>`; }
}

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr = escapeHtml;

refreshRepos().then(() => { if (repo) onRepoChange(); }).catch(e => toast(String(e)));
</script>
