<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xlr8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Warp palette */
    --color-obsidian: #000000;
    --color-graphite: #121212;
    --color-onyx: #1e1e1d;
    --color-carbon: #333333;
    --color-slate-deep: #40403f;
    --color-bone: #faf9f6;
    --color-paper: #ffffff;
    --color-ash-light: #e3e2e0;
    --color-ash-mid: #b4b4b2;
    --color-ash: #868684;
    --color-ink: #080808;
    --color-violet: #cbb0f7;

    --border: var(--color-onyx);

    --add: rgba(203, 176, 247, 0.12);
    --del: rgba(203, 176, 247, 0.06);
    --addfg: var(--color-violet);
    --delfg: var(--color-ash-mid);

    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --radius-cards: 20px;
    --radius-buttons: 33px;
    --radius-inputs: 7px;
    --radius-badges: 50px;
    --radius-small: 4px;

    --perf-h: 28px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-obsidian);
    color: var(--color-bone);
    padding-bottom: 60px;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 14px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--color-violet); color: var(--color-ink); }
  :focus-visible { outline: 1px solid var(--color-violet); outline-offset: 2px; }

  /* scrollbars — Warp aesthetic */
  * { scrollbar-width: thin; scrollbar-color: var(--color-carbon) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-carbon); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--color-slate-deep); }
  ::-webkit-scrollbar-corner { background: transparent; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  }

  .badge, .cs, .stat, #perf, .fgut, .ln .n, .ln .n2,
  #commits-info, #diff-info, #search-info, .fig { font-variant-numeric: tabular-nums; }

  .fig {
    position: relative;
    border: 1px solid var(--color-onyx);
    border-radius: var(--radius-cards);
    margin: 0 0 10px;
    padding: 24px;
    background: var(--color-obsidian);
  }
  .fig::before {
    content: attr(data-title);
    position: absolute;
    top: -10px;
    left: 24px;
    padding: 4px 12px;
    background: var(--color-carbon);
    color: var(--color-ash-mid);
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: var(--radius-badges);
  }
  .fig .fig {
    margin-bottom: 10px;
    background: var(--color-graphite);
    border-radius: var(--radius-cards);
  }
  .fig .fig::before { background: var(--color-slate-deep); }
  .fig .toolbar { margin-bottom: 10px; }
  #repo-bar { margin-bottom: 24px; }

  .recede { opacity: 0.45; }
  .a { color: var(--addfg); font-weight: 500; }
  .d { color: var(--delfg); font-weight: 500; }

  header {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
    padding: 16px 24px;
    background: var(--color-obsidian);
    border: none;
  }
  .logo {
    font-family: var(--font-sans);
    font-size: 18px;
    line-height: 1;
    color: var(--color-bone);
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header h1 { font-size: 18px; margin: 0 8px 0 0; color: var(--color-bone); font-weight: 700; }

  nav { display: flex; gap: 24px; }
  nav button {
    background: transparent;
    border: none;
    color: var(--color-ash);
    padding: 6px 0;
    cursor: pointer;
    border-radius: 7px;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  nav button:hover { color: var(--color-bone); }
  nav button.active { color: var(--color-bone); }

  #repo-label {
    font-size: 12px;
    font-weight: 400;
    color: var(--color-ash);
  }

  #perf {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    padding: 6px 20px;
    background: var(--color-obsidian);
    border-top: 1px solid var(--color-onyx);
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: nowrap;
    overflow-x: auto;
    z-index: 30;
  }
  #perf-lat { color: var(--color-bone); font-weight: 600; min-width: 54px; text-align: right; }

  #hscroll {
    position: fixed;
    left: 0;
    bottom: var(--perf-h);
    height: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    display: none;
    z-index: 25;
    background: var(--color-onyx);
    border-top: 1px solid var(--color-carbon);
  }
  #hscroll > div { height: 1px; }

  main { padding: 24px; max-width: 1200px; margin: 0 auto; }

  select, input[type="search"] {
    color-scheme: dark;
    background-color: var(--color-graphite) !important;
    color: var(--color-bone) !important;
    border: 1px solid var(--color-carbon);
    border-radius: var(--radius-inputs);
    padding: 7px 12px;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: -0.01em;
    outline: none;
    transition: border-color 0.15s ease;
  }
  select:hover, input[type="search"]:hover { border-color: var(--color-ash); }
  select:focus, input[type="search"]:focus { border-color: var(--color-violet); }
  select option { background: var(--color-graphite); color: var(--color-bone); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar button {
    background: transparent;
    color: var(--color-ash-mid);
    border: 1px solid var(--color-carbon);
    border-radius: var(--radius-buttons);
    padding: 9px 20px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: -0.01em;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .toolbar button:hover { border-color: var(--color-ash-mid); color: var(--color-bone); }
  #diff-btn { background: var(--color-paper); color: var(--color-ink); border-color: var(--color-paper); font-weight: 600; }
  #diff-btn:hover { background: var(--color-ash-light); border-color: var(--color-ash-light); color: var(--color-ink); }

  .card {
    background: var(--color-onyx);
    border: 1px solid var(--color-onyx);
    border-radius: var(--radius-cards);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card:hover { border-color: var(--color-carbon); }
  .card-h {
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-carbon);
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 13px;
    background: transparent;
    transition: background-color 0.15s;
  }
  .card-h:hover { background: var(--color-graphite); }
  .card.open .card-h { background: var(--color-graphite); }

  .stat { margin-left: auto; font-size: 12px; }
  .stat .a { color: var(--addfg); } .stat .d { color: var(--delfg); }
  .cs { font-size: 11px; font-variant-numeric: tabular-nums; }
  .cs:empty { display: none; }

  .fview { font-family: var(--font-mono); font-size: 12px; padding: 8px 0; background: var(--color-obsidian); }
  .frow { display: flex; gap: 12px; padding: 0 16px; line-height: 20px; }
  .fgut { min-width: 40px; text-align: right; color: var(--color-ash); user-select: none; flex-shrink: 0; }
  .ftxt { flex: 1; white-space: pre-wrap; word-break: break-all; }
  .fsep { opacity: 0.5; }
  mark { background: var(--color-violet); color: var(--color-ink); border-radius: 3px; padding: 0 2px; }

  .status {
    width: 20px;
    text-align: center;
    font-weight: 600;
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: var(--radius-small);
    padding: 1px 4px;
  }
  .status.A { color: var(--color-violet); background: var(--add); }
  .status.D { color: var(--color-ash-mid); background: var(--del); }
  .status.M { color: var(--color-ash-light); background: rgba(227, 226, 224, 0.1); }
  .status.R { color: var(--color-ash); background: rgba(134, 134, 132, 0.12); }

  .mono { color: var(--color-ash); font-size: 12px; font-family: var(--font-mono); }

  .vlines { position: relative; overflow-x: auto; background: var(--color-onyx); --w: 100%; }
  .vlines > * { position: absolute; left: 0; width: max-content; min-width: var(--w); }
  .ln { display: flex; white-space: pre; height: 22px; line-height: 22px; font-family: var(--font-mono); font-size: 12px; }
  .ln .n, .ln .n2 {
    width: 48px;
    flex: none;
    text-align: right;
    padding-right: 8px;
    color: var(--color-ash);
    user-select: none;
    background: var(--color-graphite);
    position: sticky;
  }
  .ln .n { left: 0; }
  .ln .n2 { left: 48px; border-right: 1px solid var(--color-carbon); }
  .ln .t { padding-left: 8px; }
  .ln.add { background: var(--add); } .ln.add .t { color: var(--color-violet); }
  .ln.del { background: var(--del); } .ln.del .t { color: var(--color-ash-mid); }

  .hunk-h {
    background: var(--color-graphite);
    color: var(--color-ash);
    padding: 3px 12px;
    font-size: 12px;
    line-height: 19px;
    height: 27px;
    overflow: hidden;
    box-sizing: border-box;
    font-family: var(--font-mono);
    border-top: 1px solid var(--color-carbon);
    border-bottom: 1px solid var(--color-carbon);
    font-weight: 500;
  }
  .gap {
    text-align: center;
    color: var(--color-ash);
    background: var(--color-obsidian);
    padding: 4px;
    font-size: 12px;
    line-height: 19px;
    height: 27px;
    overflow: hidden;
    box-sizing: border-box;
    font-family: var(--font-mono);
  }
  .file-meta {
    padding: 8px 16px;
    color: var(--color-ash);
    font-size: 12px;
    font-family: var(--font-mono);
    background: var(--color-graphite);
    border-bottom: 1px solid var(--color-carbon);
  }
    .file-loading { padding: 12px 16px; color: var(--color-ash); font-size: 13px; }
    #search-results { display: grid; grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.6fr); gap: 12px; align-items: start; }
    #search-results .search-list, #search-results .search-detail { min-width: 0; }
    #search-results .search-list { max-height: min(72vh, 820px); overflow: auto; position: sticky; top: 12px; }
    #search-results .search-detail { min-height: 180px; }
    #search-results .search-hit { cursor: pointer; }
    #search-results .search-hit.active { border-color: var(--color-violet); background: var(--color-graphite); }
    #search-results .search-preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search-results .search-detail .fview { max-height: 70vh; overflow: auto; }
    #search-results .search-line-active { background: rgba(203, 176, 247, 0.18); }
    #search-results .search-line-active .fgut { color: var(--color-violet); }
    @media (max-width: 760px) {
      #search-results { grid-template-columns: 1fr; }
      #search-results .search-list { position: static; max-height: 38vh; }
    }
    #diff-summary .diff-layout { display: grid; grid-template-columns: minmax(240px, 0.65fr) minmax(0, 1.8fr); gap: 12px; align-items: start; }
    #diff-summary .diff-files { max-height: 72vh; overflow: auto; position: sticky; top: 12px; }
    #diff-summary .diff-files .card { margin-bottom: 4px; }
    #diff-summary .diff-files .card-h { padding: 9px 10px; font-size: 12px; min-height: 44px; }
  #search-hint { margin: 6px 0 10px; font-size: 11px; line-height: 1.5; }
  #search-hint code { color: var(--color-violet); font-family: var(--font-mono); }
  .toolbar button, nav button, .card-h, .search-hit { touch-action: manipulation; }
  @media (max-width: 760px) {
    body { padding-bottom: 52px; }
    header { gap: 12px; padding: 12px 16px; }
    nav { gap: 16px; overflow-x: auto; max-width: 100%; }
    main { padding: 12px; }
    .fig { padding: 18px 12px 12px; border-radius: 14px; }
    .toolbar { gap: 8px; }
    .toolbar button { min-height: 42px; padding: 8px 14px; }
    select, input[type="search"] { min-height: 42px; max-width: 100%; }
    #search-results .search-list { max-height: 36vh; }
    #search-results .search-detail .fview { max-height: 56vh; }
    #diff-summary .diff-files { max-height: 32vh; }
    #perf { justify-content: flex-start; gap: 10px; font-size: 10px; padding-inline: 10px; }
  }
  @media (max-width: 420px) {
    header { align-items: flex-start; }
    header h1 { margin-right: 0; }
    nav { width: 100%; order: 3; }
    #repo-label { margin-left: auto; max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search-info { width: 100%; }
  }
    #diff-summary .diff-detail { min-width: 0; }
    #diff-summary .diff-detail .card { margin-bottom: 10px; }
    @media (max-width: 760px) {
      #diff-summary .diff-layout { grid-template-columns: 1fr; }
      #diff-summary .diff-files { position: static; max-height: 30vh; }
    }

  .row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-carbon);
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
    transition: background-color 0.15s;
  }
  .row:hover { background: var(--color-graphite); }
  .row:last-child { border-bottom: none; }
    #commits-list .row[data-cid] { cursor: pointer; flex-wrap: wrap; }
    #commits-list .row[data-cid] > span:nth-child(2) { flex: 1; min-width: 240px; }
    #commits-list .cs { margin-left: 56px; text-transform: none; letter-spacing: 0; }
  .row .sha {
    color: var(--color-bone);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-mono);
    padding: 2px 8px;
    background: var(--color-carbon);
    border-radius: var(--radius-small);
    border: 1px solid var(--color-carbon);
  }
  .row .sha:hover { background: var(--color-slate-deep); color: var(--color-bone); }

  .badge {
    background: transparent;
    border: 1px solid var(--color-carbon);
    border-radius: var(--radius-badges);
    padding: 4px 12px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-ash-mid);
    font-family: var(--font-sans);
  }
  .muted { color: var(--color-ash); }

  #toast {
    position: fixed;
    bottom: 48px;
    right: 20px;
    background: var(--color-paper);
    color: var(--color-ink);
    padding: 10px 20px;
    border-radius: var(--radius-buttons);
    display: none;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    z-index: 40;
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-label="xlr8">[ xlr8 ]</span></h1>
  <nav>
    <button data-tab="commits" class="active">Commits</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="search">Search</button>
    <button data-tab="pulls">Pulls</button>
  </nav>
  <span id="repo-label" class="muted"></span>
</header>
<main>
  <div class="toolbar fig" id="repo-bar" data-title="[ REPO ]" style="display:none">
    <span class="muted">repo:</span>
    <select id="repo-select"></select>
    <button id="sync-btn">sync</button>
    <span class="muted" id="sync-age"></span>
  </div>

  <section id="tab-commits">
    <div class="fig" data-title="[ COMMITS ]">
      <div class="toolbar">
        <select id="commits-ref"></select>
      <select id="commits-size" title="commits per page">
        <option>25</option>
        <option selected>50</option>
        <option>100</option>
        <option>200</option>
      </select>
      <button id="commits-prev" title="previous page">‹</button>
      <span class="muted" id="commits-info"></span>
      <button id="commits-next" title="next page">›</button>
    </div>
    <div id="commits-fig" style="margin-top:24px"></div>
    <div id="commits-list"></div>
    </div>
  </section>

  <section id="tab-compare" style="display:none">
    <div class="fig" data-title="[ COMPARE ]">
    <div class="toolbar">
      <select id="base-ref"></select><span class="muted">...</span><select id="head-ref"></select>
      <button id="diff-btn">diff</button>
      <input id="diff-find" type="search" placeholder="find in diff" style="width:140px" />
      <input id="diff-filter" type="search" placeholder="filter files" style="width:130px" />
      <span class="muted" id="diff-info"></span>
    </div>
    <div id="diff-summary"></div>
    </div>
  </section>

  <section id="tab-pulls" style="display:none">
    <div class="fig" data-title="[ PULLS ]">
    <div id="pulls-list"><span class="muted">loading…</span></div>
    </div>
  </section>

  <section id="tab-search" style="display:none">
    <div class="fig" data-title="[ SEARCH ]">
    <div class="toolbar">
      <select id="search-ref"></select>
        <input id="search-q" type="search" placeholder="Paths: mut · Contents: grep:mut · ext:rs · -exclude" aria-describedby="search-hint" style="flex:1;min-width:140px" />
        <span class="muted" id="search-info"></span>
      </div>
      <div id="search-hint" class="muted search-hint">Plain text finds file paths; use <code>grep:mut</code> to search code contents. Add <code>ext:rs</code> to filter by extension.</div>
    <div id="search-view" style="display:none"></div>
    <div id="search-results"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<div id="perf" title="spark = last 40 request round trips (client-measured) · ram/cpu/up/cache/synced from /api/stats every 2 s (paused when tab hidden)">
  <span id="perf-spark" class="muted"></span>
  <span id="perf-lat">—</span>
  <span id="perf-stats" class="muted"></span>
</div>
<div id="hscroll"><div></div></div>

<script>
let repo = null; // "owner/name"

const $ = (s) => document.querySelector(s);
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3000); };

const fmtBytes = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
const fmtDur = (s) => s < 120 ? s + "s" : s < 7200 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h";

// live stats polling
let lastS = null, fetchedAt = 0;
const meter = (frac, n = 12) => {
  const f = Math.round(Math.min(1, Math.max(0, frac)) * n);
  return "=".repeat(f) + "-".repeat(n - f);
};
function renderStats() {
  if (!lastS) return;
  const drift = Math.floor((Date.now() - fetchedAt) / 1000);
  const up = lastS.uptime_s + drift;
  const synced = lastS.synced_s ? lastS.synced_s + drift : 0;
  $("#perf-stats").textContent =
    "ram " + fmtBytes(lastS.rss) + " · cpu " + (lastS.cpu_ms / 1000).toFixed(1) + "s" +
    " · up " + fmtDur(up) + " · cache [" + meter(lastS.cache_bytes / (32 << 20)) + "] " +
    fmtBytes(lastS.cache_bytes) + "/32m";
  $("#sync-age").textContent = synced ? "synced " + fmtDur(synced) + " ago" : "";
}
function refreshStats() {
  if (document.hidden) return;
  fetch("/api/stats").then(r => r.ok ? r.json() : null).then(s => {
    if (!s) return;
    lastS = s;
    fetchedAt = Date.now();
    renderStats();
  }).catch(() => {});
}
// latency sparkline
const LAT = [], SPARK_CH = "▁▂▃▄▅▆▇█";
const mark = (ms) => {
  LAT.push(ms);
  if (LAT.length > 40) LAT.shift();
  const mx = Math.max(...LAT, 1);
  $("#perf-spark").textContent = LAT.map(v => SPARK_CH[Math.min(7, Math.floor(v / mx * 7.999))]).join("");
  $("#perf-lat").textContent = (ms >= 100 ? Math.round(ms) : ms.toFixed(1)) + "ms";
  refreshStats();
};
setInterval(refreshStats, 2000);
setInterval(renderStats, 1000);
const api = async (path) => {
  const t0 = performance.now();
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  const j = await r.json();
  mark(performance.now() - t0);
  return j;
};

// tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll("main > section").forEach(s =>
    s.style.display = s.id === "tab-" + b.dataset.tab ? "" : "none");
  if (b.dataset.tab === "pulls") loadPulls();
  if (b.dataset.tab === "search") $("#search-q").focus();
});

async function refreshRepos() {
  const { repos } = await api("/api/repos");
  const sel = $("#repo-select");
  sel.innerHTML = "";

    document.querySelector(`nav button[data-tab="${tabMap[e.key]}"]`).click();
    return;
  }
    if ((e.key === "j" || e.key === "k") && $("#tab-compare").style.display !== "none") {
      const cards = [...document.querySelectorAll("#diff-summary .diff-files .card-h[data-file-index]")];
      if (!cards.length) return;
      e.preventDefault();
      const openIdx = cards.findIndex(c => c.parentElement.classList.contains("open"));
      const next = e.key === "j"
        ? (openIdx < cards.length - 1 ? openIdx + 1 : 0)
        : (openIdx > 0 ? openIdx - 1 : cards.length - 1);
      cards.forEach((card, i) => card.parentElement.classList.toggle("open", i === next));
      showDiffFile(Number(cards[next].dataset.fileIndex), true);
      cards[next].scrollIntoView({ block: "nearest" });
    }
});
let diffInfoLast = "";

let diffBase = "", diffHead = "";
  async function showDiffFile(index, replace = true, viewToken = diffViewTok) {
    const file = diffFilesCache[index];
    if (!file) return;
    const nav = $("#diff-summary .diff-files");
    const detail = $("#diff-summary .diff-detail");
    const h = nav.querySelector(`.card-h[data-file-index="${index}"]`);
    if (replace) { vclose(detail); detail.innerHTML = ""; }
    let card = detail.querySelector(`.file-body[data-file-index="${index}"]`);
    if (card) { card.parentElement.scrollIntoView({ block: "nearest" }); return; }
    card = document.createElement("div");
    card.className = "card file-body";
    card.dataset.fileIndex = index;
    card.innerHTML = `<div class="card-h"><span class="status ${file.status}">${file.status}</span><span>${escapeHtml(file.path)}</span><span class="stat"><span class="a">+${file.additions}</span> <span class="d">−${file.deletions}</span></span></div><div class="file-loading">loading…</div>`;
    detail.appendChild(card);
    if (h) h.parentElement.classList.add("open");
    let u = `/api/${repo}/file?base=${encodeURIComponent(diffBase)}&head=${encodeURIComponent(diffHead)}&path=${encodeURIComponent(file.path)}`;
    if (file.old_path && file.old_path !== file.path) u += `&old_path=${encodeURIComponent(file.old_path)}`;
    try {
      const fd = await api(u);
      if (!card.isConnected || viewToken !== diffViewTok) return;
      card.querySelector(".file-loading").outerHTML = fileBody(fd, file.path);
      vmount(card);
    } catch (e) { if (card.isConnected) card.querySelector(".file-loading").textContent = `failed: ${e.message}`; }
  }

// virtualized diff rows
const VREG = [];
const vboxes = new Set();
const V_H = [22, 27, 27];
let vframe = 0;

function vmount(scope) {
  const box = scope.querySelector(".vlines");
  if (!box) return;
  vboxes.add(box);
  box.addEventListener("scroll", hsync, { passive: true });
  vshift();
  hsync();
}
function vclose(scope) {
  for (const b of scope.querySelectorAll(".vlines")) {
    vboxes.delete(b);
    const e = VREG[b.dataset.v | 0];
    if (e) { e.rows = null; e.tops = null; }
  }
  hsync();
}
function voff(box) { box._off = box.getBoundingClientRect().top + scrollY; }
function vshift() { vboxes.forEach(voff); vpump(); }
function vpump() {
  if (vframe) return;
  vframe = requestAnimationFrame(() => { vframe = 0; vboxes.forEach(vslice); });
}
function vfind(tops, x) {
  let lo = 0, hi = tops.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (tops[m] < x) lo = m + 1; else hi = m; }
  return lo;
}
function vslice(box) {
  const e = VREG[box.dataset.v | 0];
  if (!e || !e.rows) return;
  const start = scrollY - box._off - 600, end = scrollY - box._off + innerHeight + 600;
  if (end < 0 || start > e.tops[e.rows.length]) return;
  const i = Math.max(0, vfind(e.tops, start) - 1);
  const j = Math.min(e.rows.length, vfind(e.tops, end) + 1);
  if (box._i === i && box._j === j) return;
  let html = "";
  for (let k = i; k < j; k++) html += vrow(e.rows[k], e.tops[k]);
  box.innerHTML = html;
  box._i = i; box._j = j;
}
function vrow(r, top) {
  if (r[0] === "h") return `<div class="hunk-h" style="top:${top}px">${r[1]}</div>`;
  if (r[0] === "g") return `<div class="gap" style="top:${top}px">${r[1]}</div>`;
  return `<div class="ln ${r[0]}" style="top:${top}px">
    <span class="n">${r[1]}</span><span class="n2">${r[2]}</span><span class="t">${escapeHtml(r[3]) || " "}</span></div>`;
}

// sticky horizontal scrollbar — mirrors the most-visible open diff
const hscroll = $("#hscroll");
const hscrollInner = hscroll.firstElementChild;
let hbox = null;
function hsync() {
  let best = null, bestVis = 0;
  for (const b of vboxes) {
    const r = b.getBoundingClientRect();
    const vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
    if (vis > bestVis) { bestVis = vis; best = b; }
  }
  if (!best || best.scrollWidth <= best.clientWidth + 1) {
    if (hbox) { hbox = null; hscroll.style.display = "none"; }
    return;
  }
  hbox = best;
  hscroll.style.display = "block";
  const r = best.getBoundingClientRect();
  hscroll.style.left = r.left + "px";
  hscroll.style.width = r.width + "px";
  hscrollInner.style.width = best.scrollWidth + "px";
  const bmax = best.scrollWidth - best.clientWidth;
  const smax = hscroll.scrollWidth - hscroll.clientWidth;
  hscroll.scrollLeft = bmax > 0 ? best.scrollLeft / bmax * smax : 0;
}
hscroll.addEventListener("scroll", () => {
  if (!hbox) return;
  const bmax = hbox.scrollWidth - hbox.clientWidth;
  const smax = hscroll.scrollWidth - hscroll.clientWidth;
  hbox.scrollLeft = smax > 0 ? hscroll.scrollLeft / smax * bmax : 0;
}, { passive: true });
addEventListener("scroll", () => { vpump(); hsync(); }, { passive: true });
addEventListener("resize", () => { vboxes.forEach(voff); vpump(); hsync(); });

function fileBody(fd, path) {
  if (fd.binary) return `<div class="file-meta">${escapeHtml(path)} — binary file</div>`;
  if (!fd.hunks.length) return `<div class="file-meta">no textual changes</div>`;
  const rows = [];
  let prev = null;
  for (const h of fd.hunks) {
    const gapOld = prev ? h.old_start - (prev.old_start + prev.old_count) : (h.old_count ? h.old_start - 1 : h.old_start);
    const gapNew = prev ? h.new_start - (prev.new_start + prev.new_count) : (h.new_count ? h.new_start - 1 : h.new_start);
    const gap = Math.max(gapOld, gapNew, 0);
    if (gap > 0) rows.push(["g", `⋯ ${gap} lines unchanged`]);
    rows.push(["h", `@@ -${h.old_start},${h.old_count} +${h.new_start},${h.new_count} @@`]);
    let o = h.old_start, n = h.new_start;
    for (const l of h.lines) {
      let oc = "", nc = "";
      if (l.kind === "del") oc = o++;
      else if (l.kind === "add") nc = n++;
      else { oc = o++; nc = n++; }
      rows.push([l.kind === "add" ? "add" : l.kind === "del" ? "del" : "", oc, nc, l.text]);
    }
    prev = h;
  }
  const tops = new Int32Array(rows.length + 1);
  for (let k = 0; k < rows.length; k++) tops[k + 1] = tops[k] + V_H[rows[k][0] === "h" ? 1 : rows[k][0] === "g" ? 2 : 0];
  const idx = VREG.push({ rows, tops }) - 1;
  let maxLen = 0;
  for (const r of rows) if (r[0] !== "h" && r[0] !== "g" && r[3].length > maxLen) maxLen = r[3].length;
  const total = fd.hunks.reduce((s, h) => s + h.lines.length, 0);
  return `<div class="file-meta">${fd.hunks.length} hunks · ${total} lines</div>
    <div class="vlines" data-v="${idx}" style="height:${tops[rows.length]}px;--w:calc(104px + ${maxLen}ch)"></div>`;
}
